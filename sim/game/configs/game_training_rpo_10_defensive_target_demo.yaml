scenario_name: game_training_rpo_10_defensive_target_demo
scenario_description: RPO trainer scenario introducing a simple defensive target response
  during proximity operations.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_10_defensive_target_demo.yaml
    --speed-multiple 10`.
  game:
    flight_software_stack: fsw.game_pilot_reference
    input_profile: game.translation.v1
    hardware_profile: game.ideal_wrench.v1
    observer_policy: truth_assisted
    scoring_policy: configured_training.v1
    replay_support: debrief_history_v1
    level_name: Level 11 - Pursuit
    control_mode: ric_translation
    ric_reference_object_id: target_reference
    camera_mode: target_pair
    difficulty: easy
    initial_speed_multiple: 10.0
    speed_multiplier_options:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 200.0
    - 500.0
    - 1000.0
    speed_dt_s:
      1.0: 0.1
      10.0: 0.5
      25.0: 1.0
      50.0: 5.0
      100.0: 10.0
    two_rail_speed_control: true
    player_max_accel_km_s2: 1.5e-05
    defensive_target:
      enabled: true
      chaser_object_id: chaser
      trigger_range_km: 1.2
      trigger_closing_speed_km_s: 0.00025
      keepout_radius_km: 0.1
      max_accel_km_s2: 7.5e-06
      max_delta_v_m_s: 0.1
      cross_track_bias: 0.65
      pulse_period_s: 120.0
    training:
      enabled: true
      scenario_id: rpo_10_defensive_target_demo
      learning_goal: Track a target that performs small defensive pulses when closure
        becomes unsafe; close to within 100 m.
      player_brief: The target may maneuver when your closure becomes unsafe. Track
        the actual target motion relative to its reference orbit, correct the miss,
        and finish inside 100 m.
      pass_criteria:
      - Get within 100 m of the maneuvering target.
      - Stay under the chaser delta-v budget.
      instructor_notes:
      - This is a bridge toward defensive target behavior and future PvP.
      - The red target motion is shown relative to the target reference orbit.
      - Target defensive maneuvering is capped at 0.1 m/s total delta-v.
      target_object_id: target
      chaser_object_id: chaser
      goal_range_km: 0.1
      max_time_s: 14400.0
      max_delta_v_m_s: 8.0
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -1.8
        - 0.0
        - 0.0
        - 0.0
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    kind: satellite
    flight_software:
      stack: fsw.game_pilot_reference
      task_period_s: null
      hardware_profile: game.ideal_wrench.v1
      params:
        reference_object_id: target
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        navigation_initialization: cold
        reference_object_id: chaser
        translation_mode: passive_retreat
        goal_type: rpo.passive_retreat
        max_acceleration_m_s2: 0.0075
simulator:
  duration_s: 14400.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/game_training_rpo_10
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: false
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
    battlespace_dashboard_target_object_id: target
    battlespace_dashboard_chaser_object_id: chaser
    battlespace_dashboard_show_trajectory: true
    battlespace_dashboard_attitude_dims_m:
      target:
      - 2.0
      - 1.5
      - 1.5
      chaser:
      - 2.0
      - 1.5
      - 1.5
    battlespace_dashboard_thruster_active_threshold_km_s2: 1.0e-15
    fps: 30
    speed_multiple: 1.0
    frame_stride: 1
