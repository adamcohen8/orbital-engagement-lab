scenario_name: game_training_rpo_06_sun_angle_inspection
scenario_description: GEO RPO trainer demo for teaching Sun-angle inspection
  constraints while flying a passively safe inspection pattern.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_06_sun_angle_inspection.yaml
    --speed-multiple 10`.
  game:
    level_name: Level 6 - Sun-Angle Inspection
    control_mode: ric_translation
    camera_mode: target_pair
    difficulty: medium
    initial_speed_multiple: 10.0
    speed_multiplier_options:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 200.0
    - 500.0
    - 1000.0
    speed_dt_s:
      1.0: 0.1
      10.0: 0.5
      25.0: 1.0
      50.0: 5.0
      100.0: 10.0
    two_rail_speed_control: true
    player_max_accel_km_s2: 1.0e-05
    target_centered_plot_planes:
    - RI
    - RC
    plot_overlays_in_zoom: true
    plot_equal_axis_scale_planes:
    - RI
    - RC
    proximity_ring_plot_planes:
    - RI
    - RC
    training:
      enabled: true
      scenario_id: rpo_06_sun_angle_inspection
      learning_goal: Fly a GEO inspection pattern while keeping the chaser inside
        the target-centered Sun-angle inspection beam.
      player_brief: This GEO lesson adds lighting geometry to the safe-inspection
        problem. The amber beam marks where the lighting geometry is acceptable.
        Gates only count while you are inside the beam. Avoid the red proximity
        sphere and pass through each green inspection gate. This scenario uses
        a non-eclipse GEO epoch, so Earth shadow is not part of the lesson.
      pass_criteria:
      - Pass through both inspection gates inside the amber Sun-angle beam.
      - Be inside the amber Sun-angle beam when crossing each inspection gate.
      - Never enter the red forbidden sphere.
      - Stay under the time and delta-v budgets.
      instructor_notes:
      - The target-to-Sun direction is resolved from the configured epoch and moves
        through the target-centered RIC frame over the GEO day.
      - The allowed inspection corridor is the amber cone centered anti-Sun from
        the target.
      - This is a geometry lesson first; GEO is used to slow the motion down and
        make the Sun-angle constraint legible.
      - The configured January GEO epoch avoids Earth eclipse season; the level
        does not model Earth shadow blocking the Sun-angle corridor.
      target_object_id: target
      chaser_object_id: chaser
      inspection_gates:
      - name: upper RC inspection gate
        center_ric_km:
        - 0.75
        - 0.0
        - 0.0
        half_width_ric_km:
        - 0.25
        - 0.75
        - 0.75
      - name: lower RC inspection gate
        center_ric_km:
        - -0.75
        - 0.0
        - 0.0
        half_width_ric_km:
        - 0.25
        - 0.75
        - 0.75
      sun_angle_constraints:
      - name: GEO anti-Sun inspection beam
        sun_direction_ric:
        - 0.0
        - 1.0
        - 0.0
        allowed_center_ric:
        - 0.0
        - -1.0
        - 0.0
        dynamic_sun: true
        allowed_center_mode: anti_sun
        allowed_half_angle_deg: 32.0
        min_range_km: 0.5
        max_range_km: 4.0
        beam_radius_km: 12.0
        plot_planes:
        - RI
        - RC
      forbidden_regions:
      - name: forbidden proximity sphere
        kind: sphere
        plot_planes:
        - RI
        - RC
        center_ric_km:
        - 0.0
        - 0.0
        - 0.0
        radius_km: 0.5
      max_time_s: 86400.0
      max_delta_v_m_s: 4.0
