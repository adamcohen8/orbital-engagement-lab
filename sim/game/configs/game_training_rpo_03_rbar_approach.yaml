scenario_name: game_training_rpo_03_rbar_approach
scenario_description: RPO trainer scenario for practicing an R-bar approach while
  managing radial/in-track coupling.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_03_rbar_approach.yaml
    --speed-multiple 10`.
  game:
    flight_software_stack: fsw.game_pilot_reference
    input_profile: game.translation.v1
    hardware_profile: game.ideal_wrench.v1
    observer_policy: truth_assisted
    scoring_policy: configured_training.v1
    replay_support: debrief_history_v1
    control_mode: ric_translation
    level_name: Level 3 - R-Bar Approach
    camera_mode: target_pair
    target_centered_plot_planes:
    - RI
    - RC
    difficulty: easy
    initial_speed_multiple: 10.0
    speed_multiplier_options:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 200.0
    - 500.0
    - 1000.0
    speed_dt_s:
      1.0: 0.1
      10.0: 0.5
      25.0: 1.0
      50.0: 5.0
      100.0: 10.0
    two_rail_speed_control: true
    plot_overlays_in_zoom: false
    target_sprite_path: rpo_iss_target_sprite.png
    target_sprite_diameter_km: 0.11
    player_max_accel_km_s2: 1.0e-05
    training:
      enabled: true
      scenario_id: rpo_03_rbar_approach
      learning_goal: 'Learn the R-bar approach rhythm: pulse toward the target, coast,
        brake in stages, and arrive at the standoff range with low relative speed.'
      player_brief: Start below the target on the R-bar. Tap W briefly to build upward
        closure, coast most of the time, tap S periodically to slow down, and use
        A/D or Left/Right only for small centering corrections.
      pass_criteria:
      - 'Controls: W moves up the R-bar, S brakes downward, A/D and Left/Right should
        be tiny centering taps only.'
      - 'Playbook: pulse W briefly, coast, tap S in stages, repeat.'
      - Enter the green standoff range circle.
      - Keep relative speed below the goal threshold.
      - Stay inside the broad R-bar safety envelope.
      - Stay under the time and delta-v budgets.
      - Do not enter keepout.
      instructor_notes:
      - Use this level to compare intuition from R-bar versus V-bar approaches.
      - Have cadets explain why radial motion creates along-track drift and why staged
        braking is safer than one continuous closure.
      - A first successful run should use short W pulses, long coasts, and short S
        braking pulses before entering the standoff range.
      target_object_id: target
      chaser_object_id: chaser
      keepout_radius_km: 0.15
      goal_range_km: 0.75
      max_goal_speed_km_s: 0.0003
      forbidden_regions:
      - name: RI R-bar arch safety envelope
        kind: annular_sector
        plane: RI
        plot_planes:
        - RI
        center_ric_km:
        - 0.0
        - 0.0
        - 0.0
        inner_radius_km: 0.95
        outer_radius_km: 5.8
        angle_min_deg: -65.0
        angle_max_deg: 245.0
        max_abs_out_of_plane_km: 0.9
      - name: RC R-bar arch safety envelope
        kind: annular_sector
        plane: RC
        plot_planes:
        - RC
        center_ric_km:
        - 0.0
        - 0.0
        - 0.0
        inner_radius_km: 0.95
        outer_radius_km: 5.8
        angle_min_deg: -65.0
        angle_max_deg: 245.0
        max_abs_out_of_plane_km: 1.2
      max_time_s: 12000.0
      max_delta_v_m_s: 12.0
objects:
  rocket:
