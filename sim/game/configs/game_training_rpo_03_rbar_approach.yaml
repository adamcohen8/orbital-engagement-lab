        - -15.0
        - 1.0
        - 0.0
        - 0.011
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.game_pilot_reference
      task_period_s: null
