scenario_name: game_training_rpo_04_rendezvous
scenario_description: RPO trainer scenario for completing a close rendezvous with
  the target.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_04_rendezvous.yaml
    --speed-multiple 10`.
  game:
    flight_software_stack: fsw.game_pilot_reference
    input_profile: game.translation.v1
    hardware_profile: game.ideal_wrench.v1
    observer_policy: truth_assisted
    scoring_policy: configured_training.v1
    replay_support: debrief_history_v1
    control_mode: ric_translation
    level_name: Level 4 - Rendezvous
    difficulty: easy
    initial_speed_multiple: 10.0
    speed_multiplier_options:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 200.0
    - 500.0
    - 1000.0
    speed_dt_s:
      1.0: 0.1
      10.0: 0.5
      25.0: 1.0
      50.0: 5.0
      100.0: 10.0
    two_rail_speed_control: true
    player_max_accel_km_s2: 1.0e-05
    training:
      enabled: true
      scenario_id: rpo_04_rendezvous
      learning_goal: Complete the final rendezvous by reducing range below 10 meters
        while keeping relative speed below 50 millimeters per second.
      player_brief: Complete final approach from the hold point. Close gently enough
        to enter the 25 meter proximity zone below 50 mm/s, then settle inside the
        final 10 meter goal.
      pass_criteria:
      - Get within 10 meters of the target.
      - Keep relative speed below 50 millimeters per second.
      - Do not enter the 25 meter proximity zone faster than 50 millimeters per second.
      - Stay under the time and delta-v budgets.
      instructor_notes:
      - This level intentionally has no keepout hard fail because rendezvous requires
        final closure.
      - Use the close zoom to discuss why speed matters as much as range.
      target_object_id: target
      chaser_object_id: chaser
      goal_relative_ric_km:
      - 0.0
      - 0.0
      - 0.0
      goal_radius_km: 0.01
      max_goal_speed_km_s: 5.0e-05
      hard_speed_limit_radius_km: 0.025
      hard_speed_limit_km_s: 5.0e-05
      max_time_s: 7200.0
      max_delta_v_m_s: 1.0
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -0.75
        - 0.0
        - 0.0
        - 0.0
        - 0.0001
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    kind: satellite
    flight_software:
      stack: fsw.game_pilot_reference
      task_period_s: null
      hardware_profile: game.ideal_wrench.v1
      params:
        reference_object_id: target
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    runtime_profile: trajectory_only
simulator:
  duration_s: 7200.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/game_training_rpo_04
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: false
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
    battlespace_dashboard_target_object_id: target
    battlespace_dashboard_chaser_object_id: chaser
    battlespace_dashboard_show_trajectory: true
    battlespace_dashboard_attitude_dims_m:
      target:
      - 2.0
      - 1.5
      - 1.5
      chaser:
      - 2.0
      - 1.5
      - 1.5
    battlespace_dashboard_thruster_active_threshold_km_s2: 1.0e-15
    fps: 30
    speed_multiple: 1.0
    frame_stride: 1
