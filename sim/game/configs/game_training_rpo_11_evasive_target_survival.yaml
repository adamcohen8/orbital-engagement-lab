scenario_name: game_training_rpo_11_evasive_target_survival
scenario_description: RPO trainer scenario where the player flies the target while
  an RIC_PD chaser attempts rendezvous.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_11_evasive_target_survival.yaml
    --speed-multiple 10`.
  game:
    flight_software_stack: fsw.game_pilot_reference
    input_profile: game.translation.v1
    hardware_profile: game.ideal_wrench.v1
    observer_policy: truth_assisted
    scoring_policy: configured_training.v1
    replay_support: debrief_history_v1
    level_name: Level 10 - Evasion
    control_mode: ric_translation
    controlled_object_id: target
    ric_reference_object_id: target_reference
    camera_mode: rule_toggle_pair
    camera_rule_mode: current_pair
    camera_rule_toggle_enabled: true
    show_target_hcw_path: true
    difficulty: hard
    initial_speed_multiple: 10.0
    speed_multiplier_options:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 200.0
    speed_dt_s:
      1.0: 0.1
      10.0: 0.5
      25.0: 1.0
      50.0: 5.0
      100.0: 10.0
    max_autonomy_step_s: 1.0
    two_rail_speed_control: true
    player_max_accel_km_s2: 1.5e-05
    training:
      enabled: true
      scenario_id: rpo_11_evasive_target_survival
      learning_goal: Fly the target vehicle and evade an autonomous RIC_PD chaser
        until the timer expires.
      player_brief: You are the target. The yellow chaser is using the RIC_PD controller
        from the 10 km rendezvous experiment to close on you. Use small R/I/C pulses
        to keep at least 100 m of separation until time expires.
      pass_criteria:
      - Maintain at least 100 m separation from the chaser.
      - Stay within 1 km of the target reference orbit to remain mission capable.
      - Survive until the timer expires.
      - Stay under the target delta-v budget.
      instructor_notes:
      - This is the reverse of level 11: the player flies the target, not the chaser.
      - The chaser uses the public flagship 10 km RIC_PD orbital guidance without
        attitude gating.
      - The camera follows the target/chaser pair so evasive motion stays visible.
      - The red dashed curve is the target vehicle's current HCW coast path.
      - If the chaser uses its full delta-v budget, it coasts for the rest of the
        attempt.
      target_object_id: target
      chaser_object_id: chaser
      keepout_radius_km: 0.1
      survival_goal: true
      max_time_s: 9000.0
      max_target_reference_range_km: 1.0
      max_target_delta_v_m_s: 1.0
      max_delta_v_m_s: 25.0
      fail_on_delta_v_budget: false
      coast_chaser_after_delta_v_budget: true
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -5.0
        - 0.0
        - 0.0
        - 0.0
        - 0.001
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        navigation_initialization: cold
        max_acceleration_m_s2: 0.060000000000000005
        reference_object_id: target
        translation_mode: terminal_braking
        goal_type: rpo.terminal_braking
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    flight_software:
      stack: fsw.game_pilot_reference
      task_period_s: null
      hardware_profile: game.ideal_wrench.v1
      params:
        reference_object_id: chaser
simulator:
  duration_s: 9000.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/game_training_rpo_11
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: false
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
    battlespace_dashboard_target_object_id: target
    battlespace_dashboard_chaser_object_id: chaser
    battlespace_dashboard_show_trajectory: true
    battlespace_dashboard_attitude_dims_m:
      target:
      - 2.0
      - 1.5
      - 1.5
      chaser:
      - 2.0
      - 1.5
      - 1.5
    battlespace_dashboard_thruster_active_threshold_km_s2: 1.0e-15
    fps: 30
    speed_multiple: 1.0
    frame_stride: 1
