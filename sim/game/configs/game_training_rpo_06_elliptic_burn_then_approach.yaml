scenario_name: game_training_rpo_06_elliptic_burn_then_approach
scenario_description: RPO trainer scenario for testing burns around an eccentric target
  orbit, then completing a slow approach to a hold circle.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_06_elliptic_burn_then_approach.yaml
    --speed-multiple 10`.
  game:
    level_name: Level 6 - Elliptical Approach
    control_mode: ric_translation
    camera_mode: target_pair
    coast_prediction_model: tschauner_hempel
    target_centered_plot_planes:
    - RI
    plot_prediction_in_zoom: true
    plot_prediction_zoom_max_span_km: 8.0
    difficulty: medium
    player_max_accel_km_s2: 1.5e-05
    training:
      enabled: true
      scenario_id: rpo_06_elliptic_burn_then_approach
      learning_goal: Test radial and in-track burns around an eccentric-orbit target,
        then use the elliptical coast predictor to complete a slow approach to the
        hold circle.
      player_brief: The target is not in a circular orbit. Watch the dashed prediction
        bend as orbital rate changes. First test radial and in-track burns, then settle
        into the green hold circle behind the target.
      pass_criteria:
      - Perform at least one radial burn.
      - Perform at least one in-track burn.
      - Enter the in-track hold circle behind the target.
      - Keep relative speed below the goal threshold.
      - Do not enter the 250 m keepout zone.
      - Change the speed multiplier at least once.
      - Stay under the time and delta-v budgets.
      instructor_notes:
      - This level intentionally combines play-and-observe familiarization with a
        concrete terminal approach objective.
      - The coast predictor uses a Tschauner-Hempel-style elliptical linear model
        rather than the circular-orbit HCW projection.
      - Ask students how the RI trace changes as the target orbital rate increases
        away from apogee.
      - The correct behavior is short prediction-informed pulses, long coasts, and
        patient braking before the final hold circle.
      target_object_id: target
      chaser_object_id: chaser
      keepout_radius_km: 0.25
      goal_relative_ric_km:
      - 0.0
      - -0.75
      - 0.0
      goal_radius_km: 0.18
      max_goal_speed_km_s: 0.00035
      max_time_s: 9000.0
      max_delta_v_m_s: 8.0
      required_burn_axes:
      - radial
      - in_track
      require_speed_multiplier_change: true
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -4.5
        - 0.2
        - 0.0
        - -0.0007
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy: null
    mission_execution: null
    mission_objectives: []
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
  target:
