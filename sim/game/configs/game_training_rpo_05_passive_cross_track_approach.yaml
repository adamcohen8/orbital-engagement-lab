scenario_name: game_training_rpo_05_passive_cross_track_approach
scenario_description: RPO trainer scenario for building a passively safe cross-track
  orbit from in front of the target, then drifting backward through staggered
  inspection gates in the radial/cross-track frame.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_05_passive_cross_track_approach.yaml
    --speed-multiple 10`.
  game:
    level_name: Level 5 - Safe Inspection
    control_mode: ric_translation
    difficulty: medium
    player_max_accel_km_s2: 2.0e-05
    training:
      enabled: true
      scenario_id: rpo_05_passive_cross_track_approach
      learning_goal: Build a passively safe cross-track orbit from in front of
        the target, then initiate a slow backward in-track inspection drift through
        the staggered gates without entering the in-track forbidden cylinder.
      player_brief: The direct corridor through the target is forbidden. First build
        separation outside the red cylinder while in front of the target, then drift
        backward through the four staggered green inspection gates.
      pass_criteria:
      - Pass through all four staggered inspection gates.
      - Never enter the in-track forbidden cylinder.
      - Stay under the time and delta-v budgets.
      instructor_notes:
      - The red region is a cylinder about the in-track axis, not a sphere.
      - A safe solution establishes more than 0.5 km of cross-track separation before
        crossing the target's in-track station.
      - The player should create the passive-safe geometry first, then let the
        relative orbit drift backward through the staggered RC inspection gates.
      - This level is about geometry and patience, not a time crunch.
      target_object_id: target
      chaser_object_id: chaser
      inspection_gates:
      - name: west RC inspection gate
        center_ric_km:
        - 0.0
        - 2.25
        - -0.75
        half_width_ric_km:
        - 0.25
        - 0.7
        - 0.12
      - name: south RC inspection gate
        center_ric_km:
        - -0.75
        - 0.75
        - 0.0
        half_width_ric_km:
        - 0.12
        - 0.7
        - 0.25
      - name: east RC inspection gate
        center_ric_km:
        - 0.0
        - -0.75
        - 0.75
        half_width_ric_km:
        - 0.25
        - 0.7
        - 0.12
      - name: north RC inspection gate
        center_ric_km:
        - 0.75
        - -2.25
        - 0.0
        half_width_ric_km:
        - 0.12
        - 0.7
        - 0.25
      forbidden_regions:
      - name: passive safety in-track cylinder
        kind: cylinder
        axis: I
        plot_planes:
        - RI
        - RC
        center_ric_km:
        - 0.0
        - 0.0
        - 0.0
        radius_km: 0.5
        height_km: 6.0
      max_time_s: 28800.0
      max_delta_v_m_s: 10.0
