scenario_name: game_training_rpo_05_passive_cross_track_approach
scenario_description: RPO trainer scenario for building a passively safe cross-track
  orbit from in front of the target, then drifting backward through inspection gates
  aligned with a natural-motion RC circle.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_05_passive_cross_track_approach.yaml
    --speed-multiple 10`.
  game:
    flight_software_stack: fsw.game_pilot_reference
    input_profile: game.translation.v1
    hardware_profile: game.ideal_wrench.v1
    observer_policy: truth_assisted
    scoring_policy: configured_training.v1
    replay_support: debrief_history_v1
    level_name: Level 5 - Safe Inspection
    control_mode: ric_translation
    difficulty: medium
    initial_speed_multiple: 10.0
    speed_multiplier_options:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 200.0
    - 500.0
    - 1000.0
    speed_dt_s:
      1.0: 0.1
      10.0: 0.5
      25.0: 1.0
      50.0: 5.0
      100.0: 10.0
    two_rail_speed_control: true
    player_max_accel_km_s2: 2.0e-05
    training:
      enabled: true
      scenario_id: rpo_05_passive_cross_track_approach
      learning_goal: Build a passively safe cross-track orbit from in front of the
        target, then initiate a slow backward in-track inspection drift that carries
        the chaser around a safe RC circle outside the forbidden cylinder.
      player_brief: The direct corridor through the target is forbidden. First build
        separation outside the red cylinder while in front of the target, then drift
        backward through the four green inspection gates around the safe RC circle.
      pass_criteria:
      - Pass through all four inspection gates around the safe RC circle.
      - Never enter the in-track forbidden cylinder.
      - Stay under the time and delta-v budgets.
      instructor_notes:
      - The red region is a cylinder about the in-track axis, not a sphere.
      - A safe solution establishes more than 0.5 km of cross-track separation before
        crossing the target's in-track station.
      - The player should create the passive-safe geometry first, then let the relative
        orbit drift backward through the RC inspection gates.
      - This level is about geometry and patience, not a time crunch.
      target_object_id: target
      chaser_object_id: chaser
      inspection_gates:
      - name: left/front RC inspection gate
        center_ric_km:
        - 0.0
        - 1.125
        - -0.75
        half_width_ric_km:
        - 0.25
        - 0.25
        - 0.25
      - name: upper RC inspection gate
        center_ric_km:
        - 0.75
        - 0.375
        - 0.0
        half_width_ric_km:
        - 0.25
        - 0.25
        - 0.25
      - name: aft-right RC inspection gate
        center_ric_km:
        - 0.0
        - -1.5
        - 0.75
        half_width_ric_km:
        - 0.25
        - 0.25
        - 0.25
      - name: lower RC inspection gate
        center_ric_km:
        - -0.75
        - -0.375
        - 0.0
        half_width_ric_km:
        - 0.25
        - 0.25
        - 0.25
      forbidden_regions:
      - name: passive safety in-track cylinder
        kind: cylinder
        axis: I
        plot_planes:
        - RI
        - RC
        center_ric_km:
        - 0.0
        - 0.0
        - 0.0
        radius_km: 0.5
        height_km: 3.0
      max_time_s: 28800.0
      max_delta_v_m_s: 10.0
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - 3.0
        - 0.0
        - 0.0
        - 0.0
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.game_pilot_reference
      task_period_s: null
      hardware_profile: game.ideal_wrench.v1
      params:
        reference_object_id: target
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    runtime_profile: trajectory_only
simulator:
  duration_s: 28800.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/game_training_rpo_05
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: false
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
    battlespace_dashboard_target_object_id: target
    battlespace_dashboard_chaser_object_id: chaser
    battlespace_dashboard_show_trajectory: true
    battlespace_dashboard_attitude_dims_m:
