scenario_name: game_training_rpo_08_elliptic_rendezvous
scenario_description: RPO trainer scenario for completing a close rendezvous with
  an eccentric-orbit target.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_08_elliptic_rendezvous.yaml
    --speed-multiple 10`.
  game:
    level_name: Level 8 - Elliptical Rendezvous
    control_mode: ric_translation
    camera_mode: target_pair
    coast_prediction_model: tschauner_hempel
    target_centered_plot_planes:
    - RI
    difficulty: hard
    player_max_accel_km_s2: 1.5e-05
    training:
      enabled: true
      scenario_id: rpo_08_elliptic_rendezvous
      learning_goal: Complete the final rendezvous with an eccentric-orbit target
        by reducing range below 10 meters while keeping relative speed below 0.1 meters
        per second.
      player_brief: This is the Level 4 rendezvous problem in the eccentric-orbit
        environment. Use the elliptical coast predictor to manage the changing local
        dynamics, enter the 25 meter proximity zone below 0.1 m/s, then settle inside
        the final 10 meter goal.
      pass_criteria:
      - Get within 10 meters of the target.
      - Keep relative speed below 0.1 meters per second.
      - Do not enter the 25 meter proximity zone faster than 0.1 meters per second.
      - Stay under the time and delta-v budgets.
      instructor_notes:
      - This level repeats the Level 4 terminal-rendezvous objective after the eccentric-orbit
        approach and NMC lessons.
      - This level intentionally has no keepout hard fail because rendezvous requires
        final closure.
      - Use the close zoom to discuss why speed matters as much as range when the
        local orbital rate is changing.
      - The coast predictor uses a Tschauner-Hempel-style elliptical linear model
        rather than the circular-orbit HCW projection.
      target_object_id: target
      chaser_object_id: chaser
      goal_relative_ric_km:
      - 0.0
      - 0.0
      - 0.0
      goal_radius_km: 0.01
      max_goal_speed_km_s: 0.0001
      hard_speed_limit_radius_km: 0.025
      hard_speed_limit_km_s: 0.0001
      max_time_s: 14400.0
      max_delta_v_m_s: 3.0
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -0.75
        - 0.0
        - 0.0
        - 0.0
        - 0.0001
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy: null
    mission_execution: null
    mission_objectives: []
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 9000.0
        ecc: 0.25
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 100.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy: null
    mission_execution: null
    mission_objectives: []
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - chaser
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
simulator:
  duration_s: 7200.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/game_training_rpo_08
  mode: save
  stats:
