scenario_name: game_training_rpo_09_defensive_target_demo
scenario_description: RPO trainer scenario introducing a simple defensive target response
  during proximity operations.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_09_defensive_target_demo.yaml
    --speed-multiple 10`.
  game:
    level_name: Level 9 - Pursuit
    control_mode: ric_translation
    ric_reference_object_id: target_reference
    camera_mode: target_pair
    difficulty: easy
    player_max_accel_km_s2: 1.5e-05
    defensive_target:
      enabled: true
      chaser_object_id: chaser
      trigger_range_km: 1.2
      trigger_closing_speed_km_s: 0.00025
      keepout_radius_km: 0.1
      max_accel_km_s2: 7.5e-06
      max_delta_v_m_s: 0.1
      cross_track_bias: 0.65
      pulse_period_s: 120.0
    training:
      enabled: true
      scenario_id: rpo_09_defensive_target_demo
      learning_goal: Track a target that performs small defensive pulses when closure
        becomes unsafe; close to within 100 m.
      player_brief: The target may maneuver when your closure becomes unsafe. Track
        the actual target motion relative to its reference orbit, correct the miss,
        and finish inside 100 m.
      pass_criteria:
      - Get within 100 m of the maneuvering target.
      - Stay under the chaser delta-v budget.
      instructor_notes:
      - This is a bridge toward defensive target behavior and future PvP.
      - The yellow target motion is shown relative to the target reference orbit.
      - Target defensive maneuvering is capped at 0.1 m/s total delta-v.
      target_object_id: target
      chaser_object_id: chaser
      goal_range_km: 0.1
      max_time_s: 14400.0
      max_delta_v_m_s: 8.0
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -1.8
        - 0.0
        - 0.0
        - 0.0
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy: null
    mission_execution: null
    mission_objectives: []
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      - target_reference
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy: null
    mission_execution: null
    mission_objectives: []
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - chaser
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
