scenario_name: game_training_rpo_02_vbar_approach
scenario_description: RPO trainer scenario for practicing a V-bar approach, braking,
  and stationkeeping outside keepout.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_02_vbar_approach.yaml
    --speed-multiple 10`.
  game:
    flight_software_stack: fsw.game_pilot_reference
    input_profile: game.translation.v1
    hardware_profile: game.ideal_wrench.v1
    observer_policy: truth_assisted
    scoring_policy: configured_training.v1
    replay_support: debrief_history_v1
    control_mode: ric_translation
    level_name: Level 2 - V-Bar Approach
    camera_mode: target_pair
    difficulty: easy
    initial_speed_multiple: 10.0
    speed_multiplier_options:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 100.0
    - 200.0
    - 500.0
    - 1000.0
    speed_dt_s:
      1.0: 0.1
      10.0: 0.5
      25.0: 1.0
      50.0: 5.0
      100.0: 10.0
    two_rail_speed_control: true
    plot_overlays_in_zoom: false
    plot_overlays_in_zoom_by_plane:
      RC: true
    plot_axis_scale:
      RI:
        x: 1.2
    plot_fixed_axis_half_span_km:
      RI:
        y: 0.75
      RC:
        y: 0.75
    target_centered_plot_axes:
      RI:
      - y
    plot_equal_axis_scale_planes:
    - RC
    proximity_ring_plot_planes:
    - RI
    player_max_accel_km_s2: 2.0e-05
    training:
      enabled: true
      scenario_id: rpo_02_vbar_approach
      learning_goal: Approach along the V-bar, brake early, and settle into the stationkeeping
        box without entering keepout.
      player_brief: Approach from behind the target on the V-bar. Brake early, damp
        out the small cross-track oscillation, then settle into the green hold box
        outside keepout.
      pass_criteria:
      - Enter the V-bar stationkeeping box.
      - Keep relative speed below the goal threshold.
      - Drive the cross-track amplitude close to zero.
      - Stay inside the V-bar approach corridor.
      - Stay under the time and delta-v budgets.
      - Do not enter keepout.
      instructor_notes:
      - Watch for late braking and over-controlling near the hold box.
      - Connect in-track pulses to the delayed radial response.
      target_object_id: target
      chaser_object_id: chaser
      keepout_radius_km: 0.25
      goal_relative_ric_km:
      - 0.0
      - -0.75
      - 0.0
      goal_radius_km: 0.15
      max_goal_speed_km_s: 0.0003
      max_cross_track_amplitude_km: 0.02
      forbidden_regions:
      - name: upper radial rail of V-bar U
        plot_planes:
        - RI
        min_ric_km:
        - 0.45
        - -5.8
        - -0.8
        max_ric_km:
        - 5.8
        - 0.0
        - 0.8
      - name: lower radial rail of V-bar U
        plot_planes:
        - RI
        min_ric_km:
        - -5.8
        - -5.8
        - -0.8
        max_ric_km:
        - -0.45
        - 0.0
        - 0.8
      - name: target-side arch of V-bar U
        kind: annular_sector
        plane: RI
        plot_planes:
        - RI
        center_ric_km:
        - 0.0
        - 0.0
        - 0.0
        inner_radius_km: 0.45
        outer_radius_km: 5.8
        angle_min_deg: -90.0
        angle_max_deg: 90.0
        max_abs_out_of_plane_km: 0.8
      - name: upper radial ceiling in RC
        plot_planes:
        - RC
        min_ric_km:
        - 0.45
        - -5.8
        - -5.8
        max_ric_km:
        - 5.8
        - 0.0
        - 5.8
      - name: lower radial floor in RC
        plot_planes:
        - RC
        min_ric_km:
        - -5.8
        - -5.8
        - -5.8
        max_ric_km:
        - -0.45
        - 0.0
        - 5.8
      max_time_s: 18000.0
      max_delta_v_m_s: 1.0
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -5.0
        - 0.0
        - 0.0
        - 0.0
        - 0.0005
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.game_pilot_reference
      task_period_s: null
      hardware_profile: game.ideal_wrench.v1
      params:
        reference_object_id: target
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    runtime_profile: trajectory_only
simulator:
  duration_s: 18000.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/game_training_rpo_02
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: false
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
    battlespace_dashboard_target_object_id: target
    battlespace_dashboard_chaser_object_id: chaser
    battlespace_dashboard_show_trajectory: true
    battlespace_dashboard_attitude_dims_m:
      target:
      - 2.0
      - 1.5
      - 1.5
      chaser:
      - 2.0
      - 1.5
      - 1.5
    battlespace_dashboard_thruster_active_threshold_km_s2: 1.0e-15
    fps: 30
    speed_multiple: 1.0
    frame_stride: 1
