scenario_name: game_training_rpo_07_elliptic_nmc
scenario_description: RPO trainer scenario for entering a natural-motion circumnavigation
  about an eccentric-orbit target.
metadata:
  owner: codex
  notes: Run with `python run_game.py sim/game/configs/game_training_rpo_07_elliptic_nmc.yaml
    --speed-multiple 10`.
  game:
    level_name: Level 7 - Elliptical NMC
    control_mode: ric_translation
    camera_mode: target_pair
    coast_prediction_model: tschauner_hempel
    target_centered_plot_planes:
    - RI
    plot_fixed_axis_half_span_km:
      RI:
      - 3.25
      - 1.6
    plot_overlays_in_zoom: true
    difficulty: hard
    player_max_accel_km_s2: 1.5e-05
    training:
      enabled: true
      scenario_id: rpo_07_elliptic_nmc
      learning_goal: Enter a bounded natural-motion circumnavigation around an eccentric-orbit
        target and compare its changing local dynamics with the circular-orbit NMT
        from Level 1.
      player_brief: Shape the red trajectory into the green natural-motion circumnavigation.
        Use the elliptical dashed coast projection to choose burn timing; the target's
        orbital rate is changing, so do not force the circular-orbit rhythm. Make
        the cross-track burn near the top or bottom of the RI ellipse.
      pass_criteria:
      - Match the target radial and cross-track NMC amplitudes within tolerance.
      - Make the cross-track burn near the top or bottom of the RI ellipse.
      - Satisfy the local passive drift relationship.
      - Do not enter keepout.
      - Stay under the time and delta-v budgets.
      instructor_notes:
      - This level is the eccentric-orbit companion to Level 1's circular NMT objective.
      - The green curve is still drawn as a local target-centered natural-motion shape,
        but the dashed coast predictor uses the elliptical model.
      - Ask students to explain why the same burn geometry does not feel identical
        near different true anomalies.
      target_object_id: target
      chaser_object_id: chaser
      keepout_radius_km: 0.25
      goal_nmt_center_ric_km:
      - 0.0
      - 0.0
      - 0.0
      goal_nmt_radial_amplitude_km: 1.2
      goal_nmt_cross_track_amplitude_km: 0.8
      goal_nmt_cross_track_phase_deg: 90.0
      goal_nmt_element_tolerance_km: 0.2
      goal_nmt_velocity_tolerance_km_s: 0.0008
      required_phase_burns:
      - name: Cross-track phase burn
        axis: cross_track
        radial_abs_km: 1.2
        radial_tolerance_km: 0.25
        max_abs_intrack_km: 0.5
      max_time_s: 10800.0
      max_delta_v_m_s: 10.0
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      mass_kg: 200.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -3.0
        - 0.0
        - 0.0
        - -0.0001
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy: null
    mission_execution: null
    mission_objectives: []
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      mass_kg: 1800.0
    initial_state:
      coes:
        a_km: 9000.0
        ecc: 0.25
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 140.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy: null
    mission_execution: null
    mission_objectives: []
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - chaser
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
simulator:
  duration_s: 10800.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/game_training_rpo_07
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: false
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
    battlespace_dashboard_target_object_id: target
    battlespace_dashboard_chaser_object_id: chaser
    battlespace_dashboard_show_trajectory: true
    battlespace_dashboard_attitude_dims_m:
      target:
      - 2.0
      - 1.5
      - 1.5
      chaser:
      - 2.0
      - 1.5
      - 1.5
    battlespace_dashboard_thruster_active_threshold_km_s2: 1.0e-15
    fps: 30
    speed_multiple: 1.0
    frame_stride: 1
