scenario_name: inclination_change_maneuver_inspection
metadata:
  owner: public
  public_surface: public-config
  support_level: demonstration
  notes: Single-satellite fixed-axis normal burn inspection case for increasing inclination
    near the ascending node.
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: false
    role: chaser
    kind: satellite
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
  target:
    enabled: true
    role: target
    kind: satellite
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 44.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.2
        translation_mode: stationkeeping
simulator:
  duration_s: 6000.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: true
      attitude_substep_s: 0.1
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/inclination_change_maneuver_inspection
  mode: interactive
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: true
    save_full_log: true
  plots:
    enabled: true
    dpi: 160
    orbital_elements_object_id: target
    figure_ids:
    - orbital_elements_summary
    - orbital_elements_angles
    - control_thrust
    - thrust_alignment_error
  animations:
    enabled: false
    types: []
