scenario_name: ric_pd_10km_experiment
scenario_description: Public flagship RIC_PD 10 km RPO review scenario with attitude-coupled
  burn gating, deterministic two-body dynamics, and report-ready rendezvous artifacts.
metadata:
  owner: public
  public_surface: public-flagship
  support_level: supported
  notes: Run after the quickstart with `.venv/bin/python run_simulation.py --config
    configs/ric_pd_10km_experiment.yaml`, then open outputs/flagship_ric_pd_10km/index.md.
  intent: Demonstrate an RIC_PD transfer controller closing a 10 km-class relative-motion
    case by acquiring a low-energy coast arc before terminal cleanup while the chaser
    must satisfy attitude alignment before thrust is applied.
  evidence_role: Public golden-path artifact for single-run closed-loop RPO behavior;
    not a mission qualification or high-fidelity validation claim.
  recommended_review:
  - outputs/flagship_ric_pd_10km/index.md
  - outputs/flagship_ric_pd_10km/master_run_summary.json
  - outputs/flagship_ric_pd_10km/rendezvous_summary.png
  - outputs/flagship_ric_pd_10km/control_effort.png
  - outputs/flagship_ric_pd_10km/chaser_thrust_alignment_error.png
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -10.0
        - 0.0
        - 0.0
        - 0.0
        - 0.001
      relative_to: target
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.060000000000000005
        reference_object_id: target
        translation_mode: ric_pd_transfer
        goal_type: rpo.ric_pd_transfer
        goal_mode: maintenance
        position_tolerance_m: 5.0
        velocity_tolerance_m_s: 0.005
        mean_motion_rad_s: 0.001078
        transfer_time_s: 4800.0
        burn_time_constant_s: 35.0
        correction_interval_s: 300.0
        velocity_deadband_m_s: 0.03
        final_brake_start_s: 0.0
        terminal_start_s: 900.0
        terminal_range_m: 150.0
        kp_position_s2: 2.5e-06
        kd_velocity_s_inv: 0.0035
        attitude_reference_mode: quaternion
        attitude_boresight_body: [0.0, 0.0, 1.0]
        attitude_kp: [0.32, 0.32, 0.32]
        attitude_kd: [3.5, 3.5, 3.5]
        max_attitude_torque_n_m: 0.05
        pointing_tolerance_rad: 0.2617993877991494
        require_pointing_for_translation: true
  target:
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
simulator:
  duration_s: 12000.0
  dt_s: 1.0
  resource_profile: laptop-safe
  acceleration:
    mode: auto
    warmup: true
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: true
      attitude_substep_s: 0.1
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/flagship_ric_pd_10km
  mode: save
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_csv: true
    save_full_log: false
  plots:
    enabled: true
    preset: rendezvous
    reference_object_id: target
    style: oel_dark
    figure_ids:
    - attitude
    - attitude_control_summary
    - quaternion_error
    - control_thrust_ric
    - trajectory_ric_rect_2d_multi
    - thrust_alignment_error
    dpi: 160
  animations:
    enabled: false
    types: []
  review:
    enabled: true
    detail: standard
