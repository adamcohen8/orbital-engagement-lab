scenario_name: cr3bp_research
scenario_description: Unforced Earth-Moon CR3BP large L1 halo research example with
  review evidence.
metadata:
  owner: public
  public_surface: public-example
  support_level: experimental
  evidence_role: Ideal CR3BP research demonstration; not ephemeris aligned.
objects:
  vehicle:
    enabled: true
    kind: satellite
    role: target
    runtime_profile: trajectory_only
    specs:
      mass_kg: 1000.0
    initial_state:
      cr3bp_halo:
        system: earth_moon
        family: l1_northern_large
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
simulator:
  duration_s: 172800.0
  dt_s: 60.0
  dynamics:
    orbit:
      model: cr3bp
      cr3bp_system: earth_moon
      integrator: rkf78
      adaptive_atol: 1.0e-12
      adaptive_rtol: 1.0e-10
      orbit_substep_s: 60.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
      spherical_harmonics:
        enabled: false
    attitude:
      enabled: false
  execution:
    runtime_profiler:
      enabled: false
    object_parallelism:
      enabled: false
      backend: serial
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/cr3bp_research
  mode: save
  stats:
    print_summary: false
    save_json: false
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
