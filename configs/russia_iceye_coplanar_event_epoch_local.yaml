scenario_name: "russia_iceye_coplanar_event_epoch_local"
scenario_description: "Local event-epoch screen of reported COSMOS 2610-2614 geometry relative to ICEYE-X36 using the closest public TLEs found near the reported May 2026 maneuver window."

metadata:
  owner: "private_analysis"
  source: "SatelliteMap COSMOS TLE pages and CelesTrak/KeepTrack ICEYE-X36 TLE, pulled 2026-06-01"
  reported_event_window_utc: "2026-05-14/2026-05-20"
  common_epoch_utc: "2026-05-28T17:33:23.645088Z"
  common_epoch_jd_utc: 2461189.231523669790
  caveat: "No public ICEYE-X36 TLE near the May 14-20 event window was found in this pass; ICEYE is initialized from a 2026-06-01 TLE and propagated backward to the common epoch."
  force_model: "Two-body plus J2/J3/J4 and atmospheric drag using OEL's deterministic numerical force model."
  drag_assumption: "All objects use mass_kg=100.0, drag_area_m2=1.0, cd=2.2 pending object-specific physical data."

