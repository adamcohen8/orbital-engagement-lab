scenario_name: validation_ekf_maneuver_detection_delayed_impulse
metadata:
  owner: public
  public_surface: public-validation
  support_level: demonstration
  notes: Delayed target impulse with chaser EKF/NIS maneuver detection enabled.
objects:
  chaser:
    enabled: true
    role: chaser
    kind: satellite
    specs:
      dry_mass_kg: 180.0
      fuel_mass_kg: 0.0
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.0
        - -5.0
        - 0.0
        - 0.0
        - 0.0
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
        ekf:
          process_noise_diag:
          - 1.0e-14
          - 1.0e-14
          - 1.0e-14
          - 1.0e-16
          - 1.0e-16
          - 1.0e-16
          meas_noise_diag:
          - 1.0e-10
          - 1.0e-10
          - 1.0e-10
          - 1.0e-14
          - 1.0e-14
          - 1.0e-14
          init_cov_diag:
          - 1.0e-08
          - 1.0e-08
          - 1.0e-08
          - 1.0e-12
          - 1.0e-12
          - 1.0e-12
        maneuver_detection:
          enabled: true
          warning_probability: 0.95
          detection_probability: 0.99
          window_size: 3
          warning_count: 2
          detection_count: 2
          min_updates: 2
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
  target:
    enabled: true
    role: target
    kind: satellite
    specs:
      dry_mass_kg: 360.0
      fuel_mass_kg: 5.0
      isp_s: 220.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 3.0
        scheduled_burns:
        - start_time_s: 60.0
          duration_s: 1.0
          frame: eci
          delta_v_m_s: [0.0, 3.0, 0.0]
simulator:
  duration_s: 120.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/validation_ekf_maneuver_detection_delayed_impulse
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: true
  plots:
    enabled: false
  animations:
    enabled: false
  review:
    enabled: true
    detail: standard
