scenario_name: "controller_gimbaled_thruster_smoke"
scenario_description: "Local smoke scenario for the public GimbaledThrusterController."

rocket:
  enabled: false

chaser:
  enabled: false

target:
  enabled: true
  specs:
    mass_kg: 500.0
    actuators:
      enabled: true
      orbital:
        max_thrust_n: 1.0
        gimbaled_thruster:
          neutral_direction_body: [-1.0, 0.0, 0.0]
          position_body_m: [0.0, 0.2, 0.0]
          max_gimbal_angle_deg: 5.0
          max_gimbal_rate_deg_s: 5.0
  initial_state:
    position_eci_km: [7000.0, 0.0, 0.0]
    velocity_eci_km_s: [0.0, 7.5, 0.0]
    attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
    angular_rate_body_rad_s: [0.0, 0.0, 0.0]
  orbit_control:
    kind: "python"
    module: "sim.control.orbit.gimbaled_thruster"
    class_name: "GimbaledThrusterController"
    params:
      neutral_direction_body: [-1.0, 0.0, 0.0]
      max_gimbal_angle_rad: 0.0872664626
      base_controller:
        module: "sim.control.orbit.baseline"
        class_name: "StationkeepingController"
        params:
          target_state: [7001.0, 0.0, 0.0, 0.0, 7.5, 0.0]
          kp_pos: 1.0e-3
          kd_vel: 0.0
          max_accel_km_s2: 1.0e-3
  attitude_control:
    kind: "python"
    module: "sim.control.attitude.zero_torque"
    class_name: "ZeroTorqueController"
    params: {}

simulator:
  duration_s: 5.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: "two_body"
      orbit_substep_s: 1.0
    attitude:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false

outputs:
  output_dir: "outputs/controller_smokes/gimbaled_thruster"
  mode: "save"
  stats:
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
