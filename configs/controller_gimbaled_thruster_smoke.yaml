scenario_name: controller_gimbaled_thruster_smoke
metadata:
  owner: public
  public_surface: public-actuator
  support_level: demonstration
scenario_description: V2 physical continuous-engine smoke for bounded gimbal allocation and realization.
objects:
  target:
    enabled: true
    specs:
      mass_kg: 500.0
      dry_mass_kg: 499.0
      fuel_mass_kg: 1.0
      isp_s: 300.0
      actuators:
        enabled: true
        orbital:
          max_thrust_n: 1.0
          gimbaled_thruster:
            neutral_direction_body:
            - 1.0
            - 0.0
            - 0.0
            position_body_m:
            - 0.0
            - 0.2
            - 0.0
            max_gimbal_angle_deg: 5.0
            max_gimbal_rate_deg_s: 5.0
    initial_state:
      position_eci_km:
      - 7000.0
      - 0.0
      - 0.0
      velocity_eci_km_s:
      - 0.0
      - 7.5
      - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    role: target
    kind: satellite
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.continuous_engine.v1
      params:
        max_acceleration_m_s2: 0.01
        max_force_n: 1.0
        gimbal_limit_rad: 0.08726646259971647
        translation_mode: scheduled_burn
        scheduled_burns:
        - start_time_s: 0.0
          duration_s: 5.0
          delta_v_m_s: [0.001, 0.00005, 0.0]
          frame: eci
simulator:
  duration_s: 5.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
    attitude:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/controller_smokes/gimbaled_thruster
  mode: save
  stats:
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
