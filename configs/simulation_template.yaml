scenario_name: everything_on_template
metadata:
  owner: public
  public_surface: public-template
  support_level: supported
  notes: Full-feature baseline with rocket + target + chaser, broad dynamics, mission
    hooks, plots, and animations enabled.
objects:
  rocket:
    enabled: true
    role: rocket
    preset: ../sim/presets/objects/basic_two_stage_rocket.yaml
    specs:
      payload_mass_kg: 150.0
      thrust_axis_body:
      - 1.0
      - 0.0
      - 0.0
      aero:
        reference_area_m2: 10.0
        reference_length_m: 30.0
        cp_offset_body_m:
        - 0.0
        - 0.0
        - 0.0
        cd: 0.2
    initial_state:
      launch_lat_deg: 28.5
      launch_lon_deg: -80.6
      launch_alt_km: 0.0
      launch_azimuth_deg: 90.0
    base_guidance:
      kind: python
      module: sim.rocket.guidance
      class_name: OpenLoopPitchProgramGuidance
      params:
        vertical_hold_s: 8.0
        pitch_start_s: 8.0
        pitch_end_s: 190.0
        pitch_final_deg: 75.0
        max_throttle: 1.0
    guidance_modifiers: []
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.zero_torque
      class_name: ZeroTorqueController
      params: {}
    mission_strategy:
      kind: python
      module: sim.mission.modules
      class_name: RocketPursuitMissionStrategy
      params:
        target_id: target
    mission_execution:
      kind: python
      module: sim.mission.modules
      class_name: RocketGoNowExecution
      params: {}
    mission_objectives: []
    bridge:
      enabled: false
      mode: external
      endpoint: null
      module: null
      class_name: null
      params: {}
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: true
        max_range_km: 50000.0
      sensor_error:
        pos_sigma_km:
        - 0.01
        - 0.01
        - 0.01
        vel_sigma_km_s:
        - 0.0001
        - 0.0001
        - 0.0001
      estimation:
        type: ekf
  chaser:
    enabled: true
    role: chaser
    preset: ../sim/presets/objects/basic_satellite.yaml
    specs:
      mass_kg: 200.0
      mass_properties:
        mass_kg: 200.0
        center_of_mass_body_m:
        - 0.0
        - 0.0
        - 0.0
        inertia_kg_m2:
        - - 120.0
          - 0.0
          - 0.0
        - - 0.0
          - 100.0
          - 0.0
        - - 0.0
          - 0.0
          - 80.0
        inertia_reference_point: center_of_mass
        frame: body
        source: user_supplied
        confidence: assumed
      geometry:
        profile_path: null
      aero:
        reference_area_m2: 1.0
        drag_area_m2: 1.0
        cd: 2.2
        cl: 0.0
        lift_area_m2: null
        lift_axis_body:
        - 0.0
        - 0.0
        - 1.0
        nose_radius_m: 0.5
        reference_length_m: 1.0
        cp_offset_body_m:
        - 0.0
        - 0.0
        - 0.0
    initial_state:
      source: rocket_insertion
      deploy_dv_body_m_s:
      - 10.0
      - 0.0
      - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.lqr
      class_name: HCWLQRController
      params:
        mean_motion_rad_s: 0.001078
        max_accel_km_s2: 2.0e-06
        design_dt_s: 10.0
        ric_curv_state_slice:
        - 0
        - 6
        chief_eci_state_slice:
        - 6
        - 12
    attitude_control:
      kind: python
      module: sim.control.attitude.surrogate_snap
      class_name: SurrogateSnapECIController
      params:
        desired_attitude_quat_bn:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        cancel_rate_mag_rad_s2: 1.0
        rate_tolerance_rad_s: 0.001
        slew_time_180_s: 1.0
        pointing_sigma_deg: 0.05
        default_dt_s: 1.0
        rng_seed: 2
    mission_strategy:
      kind: python
      module: sim.mission.modules
      class_name: PursuitMissionStrategy
      params:
        target_id: target
        use_knowledge_for_targeting: true
        max_accel_km_s2: 2.0e-06
        align_to_thrust: true
    mission_execution:
      kind: python
      module: sim.mission.modules
      class_name: ControllerPointingExecution
      params:
        thruster_direction_body:
        - 1.0
        - 0.0
        - 0.0
        alignment_tolerance_deg: 10.0
        require_attitude_alignment: true
    mission_objectives: []
    bridge:
      enabled: false
      mode: external
      endpoint: null
      module: null
      class_name: null
      params: {}
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: true
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.005
        - 0.005
        - 0.005
        vel_sigma_km_s:
        - 5.0e-05
        - 5.0e-05
        - 5.0e-05
      estimation:
        type: ekf
  target:
    enabled: true
    role: target
    preset: ../sim/presets/objects/basic_satellite.yaml
    reference_orbit:
      enabled: false
    specs:
      mass_kg: 400.0
      aero:
        cd: 2.2
        cl: 0.0
        lift_axis_body:
        - 0.0
        - 0.0
        - 1.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.001
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    attitude_control:
      kind: python
      module: sim.control.attitude.surrogate_snap
      class_name: SurrogateSnapECIController
      params:
        desired_attitude_quat_bn:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        cancel_rate_mag_rad_s2: 1.0
        rate_tolerance_rad_s: 0.001
        slew_time_180_s: 1.0
        pointing_sigma_deg: 0.05
        default_dt_s: 1.0
        rng_seed: 3
    mission_strategy:
      kind: python
      module: sim.mission.modules
      class_name: HoldMissionStrategy
      params:
        attitude_mode: hold_eci
        hold_quat_bn:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
    mission_execution:
      kind: python
      module: sim.mission.modules
      class_name: ControllerPointingExecution
      params:
        thruster_direction_body:
        - 1.0
        - 0.0
        - 0.0
        alignment_tolerance_deg: 10.0
        require_attitude_alignment: false
    mission_objectives: []
    bridge:
      enabled: false
      mode: external
      endpoint: null
      module: null
      class_name: null
      params: {}
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - rocket
      - chaser
      conditions:
        require_line_of_sight: true
        max_range_km: 50000.0
      sensor_error:
        pos_sigma_km:
        - 0.02
        - 0.02
        - 0.02
        vel_sigma_km_s:
        - 0.0002
        - 0.0002
        - 0.0002
      estimation:
        type: ekf
ground_stations:
- id: colorado_springs
  lat_deg: 38.803
  lon_deg: -104.526
  alt_km: 1.9
  min_elevation_deg: 10.0
  max_range_km: 2500.0
simulator:
  duration_s: 7200.0
  dt_s: 1.0
  initial_jd_utc: null
  resource_profile: config
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: null
      j2: false
      j3: false
      j4: false
      drag: true
      srp: true
      spherical_harmonics:
        enabled: false
        degree: 8
        order: 8
    reentry:
      enabled: false
      begin_altitude_km: 300.0
      object_ids: []
      heat_rate_coefficient: 0.000183
      termination:
        enabled: false
        terminate_on_entry: false
        min_altitude_km: null
        max_dynamic_pressure_pa: null
        max_drag_decel_m_s2: null
        max_g_load: null
        max_heat_rate_w_m2: null
        max_heat_load_j_m2: null
        by_object: {}
    attitude:
      enabled: true
      attitude_substep_s: null
      disturbance_torques:
        gravity_gradient: true
        magnetic: true
        drag: true
        srp: true
    rocket:
      enabled: true
      atmosphere_model: ussa1976
      attitude_mode: dynamic
      target_altitude_km: 500.0
      target_altitude_tolerance_km: 25.0
      target_eccentricity_max: 0.02
      insertion_hold_time_s: 30.0
      aero_model_enabled: true
      use_stagewise_aero_geometry: true
      area_ref_m2: null
      cd: 0.35
      cr: 1.2
      max_q_limiter_enabled: true
      max_q_pa: 45000.0
      min_throttle: 0.0
      orbit_insertion_cutoff_enabled: false
      cutoff_min_alt_km: 90.0
      cutoff_min_periapsis_alt_km: 140.0
      cutoff_apoapsis_margin_km: 10.0
      cutoff_energy_margin_km2_s2: 0.01
      cutoff_ecc_relax_factor: 3.0
      cutoff_hard_escape_enabled: true
      cutoff_near_escape_speed_margin_frac: 0.03
      aero:
        reference_area_m2: 10.0
        reference_length_m: 30.0
        cp_offset_body_m:
        - 0.0
        - 0.0
        - 0.0
        cd_base: 0.2
        cd_alpha2: 0.1
        cd_supersonic: 0.28
        transonic_peak_cd: 0.22
        transonic_mach: 1.0
        transonic_width: 0.22
        cl_alpha_per_rad: 0.15
        cy_beta_per_rad: 0.15
        cm_alpha_per_rad: -0.02
        cn_beta_per_rad: -0.02
        cl_roll_per_rad: -0.01
        alpha_limit_deg: 20.0
        beta_limit_deg: 20.0
  environment:
    ephemeris_mode: analytic_simple
    use_spice: false
    atmosphere_model: ussa1976
    atmosphere_env: {}
  plugin_validation:
    strict: true
    strict_runtime: false
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
    by_object: {}
outputs:
  output_dir: outputs/everything_on_template
  mode: both
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: true
    save_history_npz: false
  plots:
    enabled: true
    preset: rendezvous
    reference_object_id: target
    draw_earth_map: true
    orbital_elements_object_id: ''
    figure_ids:
    - trajectory_eci_multi
    - trajectory_ecef_multi
    - trajectory_ric_rect_multi
    - trajectory_ric_curv_multi
    - trajectory_ecef
    - trajectory_ric_rect
    - trajectory_ric_curv
    - attitude
    - quaternion_eci
    - quaternion_ric
    - rates_eci
    - rates_ric
    - relative_range
    - knowledge_timeline
    - control_thrust
    - control_thrust_multi
    - mission_recovery_trade_space
    dpi: 160
  animations:
    enabled: true
    types:
    - ground_track_multi
    - ground_track
    fps: 30
    speed_multiple: 5.0
    frame_stride: 2
    draw_earth_map: true
  resource_limits:
    max_history_memory_mb: 1024
    checkpoint_enabled: true
    throttle_enabled: true
