scenario_name: rmoe_if_then_nmc_demo
scenario_description: Rule-based RMOE controller demo that arrests in-track drift
  near a passive target and builds cross-track NMC amplitude for passive safety.
metadata:
  owner: public
  public_surface: public-config
  support_level: demonstration
  notes: Demonstrates RMOEIfThenController close-zone drift arrest and C=0 cross-track
    amplitude burns under two-body dynamics.
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
    initial_state:
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -0.02
        - 0.0
        - 0.0
        - 0.0
        - 0.00075
      relative_to: target
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.002
        reference_object_id: target
        translation_mode: ric_hold
        control_law: rmoe_if_then
        rmoe_target_cross_track_amplitude_m: 750.0
        rmoe_max_drift_rate_m_s: 0.02
        goal_type: rpo.rmoe_nmc
  target:
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
    kind: satellite
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
simulator:
  duration_s: 24000.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/rmoe_if_then_nmc_demo
  mode: interactive
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: true
  plots:
    enabled: true
    preset:
    - rendezvous
    reference_object_id: target
    figure_ids: []
    dpi: 140
  animations:
    enabled: false
    types: []
