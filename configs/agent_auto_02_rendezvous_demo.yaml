scenario_name: agent_auto_02_rendezvous_demo
scenario_description: 'Agent-generated public demo: short v2 RIC feedback rendezvous check
  with review evidence and plots.'
metadata:
  owner: public
  public_surface: public-agent-workflow
  support_level: supported
  notes: Generated for the weekly OEL agentic workflow post. Uses public two-body
    dynamics, the public v2 RIC feedback stack, and queryable review evidence.
objects:
  target:
    kind: satellite
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
  chaser:
    kind: satellite
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
    initial_state:
      relative_to: target
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -3.0
        - 0.2
        - 0.0
        - 0.0002
        - 0.0
    knowledge:
      refresh_rate_s: 5.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.005
        - 0.005
        - 0.005
        vel_sigma_km_s:
        - 5.0e-05
        - 5.0e-05
        - 5.0e-05
      estimation:
        type: ekf
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        reference_object_id: target
        translation_mode: ric_hold
        goal_type: rpo.ric_hold
simulator:
  duration_s: 1200.0
  dt_s: 5.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 5.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/agent_auto_02_rendezvous_demo
  mode: save
  stats:
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: true
    preset: rendezvous
    reference_object_id: target
    style: oel_dark
    dpi: 140
    figure_ids: []
  animations:
    enabled: false
    types: []
