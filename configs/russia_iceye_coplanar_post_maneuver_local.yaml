scenario_name: "russia_iceye_coplanar_post_maneuver_local"
scenario_description: "Local post-maneuver screen of reported COSMOS 2610-2614 geometry relative to ICEYE-X36 using the earliest complete public post-maneuver TLE set found in this pass."

metadata:
  owner: "private_analysis"
  source: "SatelliteMap/N2YO/KeepTrack public TLE pages, pulled 2026-06-01"
  reported_maneuver_window_utc: "2026-05-20/2026-05-21"
  post_maneuver_cutoff_utc: "2026-05-21T00:00:00Z"
  common_epoch_utc: "2026-05-28T16:22:02.246016Z"
  common_epoch_jd_utc: 2461189.181970439851
  caveat: "COSMOS 2611 limits the earliest complete sourced post-maneuver set found in this pass; older public elements exist for some objects but are pre-maneuver or incomplete. OEL initializes TLE mean elements and numerically propagates them to the common epoch rather than using SGP4 as the production propagator."
  force_model: "Two-body plus J2/J3/J4 and atmospheric drag using OEL's deterministic numerical force model."
  drag_assumption: "All objects use mass_kg=100.0, drag_area_m2=1.0, cd=2.2 pending object-specific physical data."

