scenario_name: orbit_transfer_planner_demo
metadata:
  owner: public
  public_surface: public-config
  support_level: demonstration
scenario_description: 'Demonstrates the Orbit Transfer Planner as a two-body Lambert
  trade-space search for recovering a reference orbit slot after a small in-track
  disturbance.

  '
objects:
  target:
    enabled: true
    role: target
    kind: satellite
    specs:
      mass_kg: 100.0
      isp_s: 220.0
      max_thrust_n: 20.0
    initial_state:
      coes:
        a_km: 6778.137
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        translation_mode: stationkeeping
simulator:
  duration_s: 120.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: false
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/orbit_transfer_planner_demo
  mode: save
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_full_log: false
  plots:
    enabled: true
    figure_ids:
    - mission_recovery_trade_space
  animations:
    enabled: false
    types: []
  review:
    enabled: true
    detail: standard
analysis:
  mission_recovery:
    enabled: true
    object_id: target
    goal: orbit_slot
    assessment_time_s: final
    slot_tolerance_deg: 1.0
    max_phasing_orbits: 25
    planner:
      enabled: true
      sources:
      - analytic_reconstitution
      - orbit_transfer
      modes:
      - min_delta_v
      - min_time
      - constrained
      max_recovery_time_s: 3600.0
      max_recovery_delta_v_m_s: 20.0
      candidate_count: 10
      simulate_candidates: true
      orbit_transfer:
        enabled: true
        departure_samples: 5
        time_of_flight_samples: 8
        min_time_of_flight_s: 300.0
        max_time_of_flight_s: 3600.0
        short_way: true
        long_way: false
    propulsion:
      spacecraft_mass_kg: 100.0
      isp_s: 220.0
      max_thrust_n: 20.0
    element_tolerances:
      a_km: 1.0
      ecc: 0.001
      slot_phase_deg: 1.0
