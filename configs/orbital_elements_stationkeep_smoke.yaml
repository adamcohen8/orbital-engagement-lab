scenario_name: orbital_elements_stationkeep_smoke
metadata:
  owner: public
  public_surface: public-validation
  support_level: demonstration
  notes: Single-satellite COE stationkeeping smoke case with an initial orbit offset
    from the desired orbit.
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: false
    role: chaser
    kind: satellite
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
  target:
    enabled: true
    role: target
    kind: satellite
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7050.0
        ecc: 0.01
        inc_deg: 42.0
        raan_deg: 11.0
        argp_deg: 25.0
        true_anomaly_deg: 33.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.005
        translation_mode: orbital_elements
        target_semi_major_axis_m: 7000000.0
        target_eccentricity: 0.0
simulator:
  duration_s: 600.0
  dt_s: 5.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 5.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: true
      attitude_substep_s: 0.1
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/orbital_elements_stationkeep_smoke
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
