scenario_name: "validation_knowledge_filtering_single"

metadata:
  owner: "validation"
  notes: "Noisy state-vector knowledge benchmark for truth/measurement/estimate evidence."

rocket:
  enabled: false
  role: "rocket"

chaser:
  enabled: true
  role: "chaser"
  specs:
    preset_satellite: "BASIC_SATELLITE"
    dry_mass_kg: 180.0
    fuel_mass_kg: 20.0
    thruster: "BASIC_CHEMICAL_Z_BOTTOM"
    attitude_system: "BASIC_REACTION_WHEELS_3AXIS"
  initial_state:
    relative_to_target_ric:
      frame: "curv"
      state: [0.0, -3.0, 0.0, 0.0, 0.0, 0.0]
    attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
    angular_rate_body_rad_s: [0.0, 0.0, 0.0]
  orbit_control:
    kind: "python"
    module: "sim.control.orbit.zero_controller"
    class_name: "ZeroController"
    params: {}
  attitude_control:
    kind: "python"
    module: "sim.control.attitude.surrogate_snap"
    class_name: "SurrogateSnapECIController"
    params:
      desired_attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      cancel_rate_mag_rad_s2: 1.0
      rate_tolerance_rad_s: 1.0e-3
      slew_time_180_s: 1.0
      pointing_sigma_deg: 0.05
      default_dt_s: 0.05
      rng_seed: 17
  mission_strategy:
    kind: "python"
    module: "sim.mission.modules"
    class_name: "HoldMissionStrategy"
    params:
      attitude_mode: "hold_eci"
  mission_execution:
    kind: "python"
    module: "sim.mission.modules"
    class_name: "ControllerPointingExecution"
    params:
      require_attitude_alignment: false
  mission_objectives: []
  knowledge:
    refresh_rate_s: 2.0
    targets: ["target"]
    conditions:
      require_line_of_sight: true
      max_range_km: 10000.0
    sensor_error:
      pos_sigma_km: [0.01, 0.01, 0.01]
      vel_sigma_km_s: [0.0001, 0.0001, 0.0001]
    estimation:
      type: "ekf"
      measurement_model: "state"
      ekf:
        process_noise_diag: [1.0e-10, 1.0e-10, 1.0e-10, 1.0e-12, 1.0e-12, 1.0e-12]
        meas_noise_diag: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-8, 1.0e-8, 1.0e-8]
        init_cov_diag: [1.0e-2, 1.0e-2, 1.0e-2, 1.0e-6, 1.0e-6, 1.0e-6]

target:
  enabled: true
  role: "target"
  specs:
    preset_satellite: "BASIC_SATELLITE"
    dry_mass_kg: 360.0
    fuel_mass_kg: 0.0
    attitude_system: "BASIC_REACTION_WHEELS_3AXIS"
  initial_state:
    coes:
      a_km: 7000.0
      ecc: 0.0
      inc_deg: 45.0
      raan_deg: 0.0
      argp_deg: 0.0
      true_anomaly_deg: 0.0
    attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
    angular_rate_body_rad_s: [0.0, 0.0, 0.0]
  orbit_control:
    kind: "python"
    module: "sim.control.orbit.zero_controller"
    class_name: "ZeroController"
    params: {}
  attitude_control:
    kind: "python"
    module: "sim.control.attitude.surrogate_snap"
    class_name: "SurrogateSnapECIController"
    params:
      desired_attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      cancel_rate_mag_rad_s2: 1.0
      rate_tolerance_rad_s: 1.0e-3
      slew_time_180_s: 1.0
      pointing_sigma_deg: 0.05
      default_dt_s: 0.05
      rng_seed: 19
  mission_strategy:
    kind: "python"
    module: "sim.mission.modules"
    class_name: "HoldMissionStrategy"
    params:
      attitude_mode: "hold_eci"
  mission_execution:
    kind: "python"
    module: "sim.mission.modules"
    class_name: "ControllerPointingExecution"
    params:
      require_attitude_alignment: false
  mission_objectives: []

simulator:
  scenario_type: "auto"
  duration_s: 600.0
  dt_s: 2.0
  dynamics:
    orbit:
      orbit_substep_s: 2.0
      model: "two_body"
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: true
      attitude_substep_s: 0.2
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: "analytic_simple"
    atmosphere_env: {}
  plugin_validation:
    strict: true
  resource_profile: "laptop-safe"
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137

outputs:
  output_dir: "outputs/validation_knowledge_filtering_single"
  mode: "save"
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: true
    preset: "estimation"
    figure_ids:
      - "knowledge_filtering"
  animations:
    enabled: false
    types: []
