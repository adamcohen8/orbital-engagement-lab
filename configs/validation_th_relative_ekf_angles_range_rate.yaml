scenario_name: validation_th_relative_ekf_angles_range_rate
metadata:
  owner: public
  public_surface: public-validation
  support_level: demonstration
  notes: Passive eccentric-chief RPO knowledge benchmark for TH-integrated relative
    EKF with az/el/range/range-rate measurements.
objects:
  chaser:
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      isp_s: 220.0
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.04
        - -0.06
        - 0.025
        - 5.0e-06
        - -3.0e-06
        - 2.0e-06
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 2.0
      targets:
      - target
      conditions:
        require_line_of_sight: true
        max_range_km: 10000.0
      sensor_error:
        angle_sigma_rad: 0.0001
        range_sigma_km: 0.001
        range_rate_sigma_km_s: 1.0e-05
      estimation:
        type: relative_th_ekf
        measurement_model: relative_angles_range_rate
        measurement_origin: deputy
        initial_state_ric:
        - 0.043
        - -0.057
        - 0.022
        - 4.0e-06
        - -2.0e-06
        - 3.0e-06
        ekf:
          process_noise_diag:
          - 1.0e-11
          - 1.0e-11
          - 1.0e-11
          - 1.0e-13
          - 1.0e-13
          - 1.0e-13
          init_cov_diag:
          - 0.0004
          - 0.0004
          - 0.0004
          - 4.0e-08
          - 4.0e-08
          - 4.0e-08
          integration_substep_s: 2.0
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        reference_object_id: target
        translation_mode: ric_hold
        goal_type: rpo.ric_hold
  target:
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7600.0
        ecc: 0.12
        inc_deg: 34.0
        raan_deg: 18.0
        argp_deg: 42.0
        true_anomaly_deg: 25.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        translation_mode: stationkeeping
simulator:
  duration_s: 300.0
  dt_s: 2.0
  dynamics:
    orbit:
      orbit_substep_s: 2.0
      model: two_body
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: true
      attitude_substep_s: 0.2
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  resource_profile: laptop-safe
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/validation_th_relative_ekf_angles_range_rate
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  review:
    enabled: true
    detail: standard
  animations:
    enabled: false
    types: []
