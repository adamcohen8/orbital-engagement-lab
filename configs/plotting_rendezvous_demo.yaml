scenario_name: plotting_rendezvous_demo
scenario_description: Public 6000-second rendezvous demo that generates dashboard,
  control, sensor, estimation, ground-track, access, and orbital-element plots.
metadata:
  owner: public
  public_surface: public-plotting
  support_level: demonstration
  notes: Deterministic plotting demo for README and docs gallery artifacts.
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    preset: basic_satellite
    specs:
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
    initial_state:
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -3.0
        - 0.2
        - 0.0
        - 0.0002
        - 0.0
      relative_to: target
    orbit_control:
      kind: python
      module: sim.control.orbit.lqr
      class_name: HCWLQRController
      params:
        mean_motion_rad_s: 0.001078
        max_accel_km_s2: 2.0e-05
        design_dt_s: 1.0
        ric_curv_state_slice:
        - 0
        - 6
        chief_eci_state_slice:
        - 6
        - 12
    knowledge:
      refresh_rate_s: 5.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
        dropout_prob: 0.05
      sensor_error:
        pos_sigma_km:
        - 0.005
        - 0.005
        - 0.005
        vel_sigma_km_s:
        - 5.0e-05
        - 5.0e-05
        - 5.0e-05
      estimation:
        type: ekf
    kind: satellite
  target:
    enabled: true
    role: target
    preset: basic_satellite
    specs:
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
    knowledge:
      refresh_rate_s: 10.0
      targets:
      - chaser
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.01
        - 0.01
        - 0.01
        vel_sigma_km_s:
        - 0.0001
        - 0.0001
        - 0.0001
      estimation:
        type: ekf
    kind: satellite
ground_stations:
- id: colorado_springs
  lat_deg: 38.803
  lon_deg: -104.526
  alt_km: 1.9
  min_elevation_deg: 10.0
  max_range_km: 2500.0
simulator:
  duration_s: 6000.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/plotting_rendezvous_demo
  mode: save
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: true
  plots:
    enabled: true
    preset:
    - rendezvous
    - estimation
    - access
    reference_object_id: target
    orbital_elements_object_id: target
    style: oel_dark
    figure_ids:
    - ground_track_multi
    - orbital_element_a
    - orbital_element_ecc
    - orbital_element_inc
    - orbital_element_raan
    - orbital_element_argp
    - orbital_element_true_anomaly
    - orbital_elements_summary
    - orbital_elements_angles
    dpi: 140
  animations:
    enabled: false
    types: []
  review:
    enabled: true
    detail: standard
