scenario_name: "actuator_lab_presets_smoke"
scenario_description: "Local actuator preset lab covering public RCS, electric propulsion, gimbaled thruster, magnetorquer, and CMG presets."

objects:
  rcs_sat:
    enabled: true
    kind: "satellite"
    specs:
      mass_kg: 250.0
      actuator_preset: "BASIC_RCS_6DOF"
    initial_state:
      position_eci_km: [7000.0, 0.0, 0.0]
      velocity_eci_km_s: [0.0, 7.5, 0.0]
      attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      angular_rate_body_rad_s: [0.0, 0.0, 0.0]
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.baseline"
      class_name: "StationkeepingController"
      params:
        target_state: [7001.0, 0.0, 0.0, 0.0, 7.5, 0.0]
        kp_pos: 1.0e-3
        kd_vel: 0.0
        max_accel_km_s2: 1.0e-3
    attitude_control:
      kind: "python"
      module: "sim.control.attitude.zero_torque"
      class_name: "ZeroTorqueController"
      params: {}

  ep_sat:
    enabled: true
    kind: "satellite"
    specs:
      mass_kg: 250.0
      actuators:
        preset: "BASIC_ELECTRIC_PROPULSION"
        orbital:
          electric_propulsion:
            max_thrust_n: 0.25
    initial_state:
      position_eci_km: [7000.0, 2.0, 0.0]
      velocity_eci_km_s: [0.0, 7.5, 0.0]
      attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      angular_rate_body_rad_s: [0.0, 0.0, 0.0]
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.electric_propulsion"
      class_name: "ElectricPropulsionController"
      params:
        mass_kg: 250.0
        max_thrust_n: 0.25
        base_controller:
          module: "sim.control.orbit.baseline"
          class_name: "StationkeepingController"
          params:
            target_state: [7001.0, 2.0, 0.0, 0.0, 7.5, 0.0]
            kp_pos: 1.0e-3
            kd_vel: 0.0
            max_accel_km_s2: 1.0e-3
    attitude_control:
      kind: "python"
      module: "sim.control.attitude.zero_torque"
      class_name: "ZeroTorqueController"
      params: {}

  gimbal_sat:
    enabled: true
    kind: "satellite"
    specs:
      mass_kg: 250.0
      actuator_preset: "BASIC_GIMBALED_THRUSTER"
    initial_state:
      position_eci_km: [7000.0, 4.0, 0.0]
      velocity_eci_km_s: [0.0, 7.5, 0.0]
      attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      angular_rate_body_rad_s: [0.0, 0.0, 0.0]
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.gimbaled_thruster"
      class_name: "GimbaledThrusterController"
      params:
        neutral_direction_body: [-1.0, 0.0, 0.0]
        max_gimbal_angle_rad: 0.0872664626
        base_controller:
          module: "sim.control.orbit.baseline"
          class_name: "StationkeepingController"
          params:
            target_state: [7001.0, 4.0, 0.0, 0.0, 7.5, 0.0]
            kp_pos: 1.0e-3
            kd_vel: 0.0
            max_accel_km_s2: 1.0e-3
    attitude_control:
      kind: "python"
      module: "sim.control.attitude.zero_torque"
      class_name: "ZeroTorqueController"
      params: {}

  mtq_sat:
    enabled: true
    kind: "satellite"
    specs:
      mass_kg: 120.0
      mass_properties:
        inertia_kg_m2:
          - [12.0, 0.0, 0.0]
          - [0.0, 10.0, 0.0]
          - [0.0, 0.0, 8.0]
      actuator_preset: "BASIC_MAGNETORQUER_TRIAD"
    initial_state:
      position_eci_km: [7000.0, 6.0, 0.0]
      velocity_eci_km_s: [0.0, 7.5, 0.0]
      attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      angular_rate_body_rad_s: [0.02, -0.01, 0.005]
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.zero_controller"
      class_name: "ZeroController"
      params: {}
    attitude_control:
      kind: "python"
      module: "sim.control.attitude.bdot_magnetorquer"
      class_name: "MagnetorquerBdotController"
      params:
        magnetic_field_body_t: [0.0, 0.0, 5.0e-5]
        gain: 1.0e5
        max_torque_nm: 1.0e-4

  cmg_sat:
    enabled: true
    kind: "satellite"
    specs:
      mass_kg: 120.0
      mass_properties:
        inertia_kg_m2:
          - [12.0, 0.0, 0.0]
          - [0.0, 10.0, 0.0]
          - [0.0, 0.0, 8.0]
      actuators:
        preset: "BASIC_CMG_TRIAD"
        attitude:
          control_moment_gyros:
            max_torque_nm: [0.02, 0.02, 0.02]
    initial_state:
      position_eci_km: [7000.0, 8.0, 0.0]
      velocity_eci_km_s: [0.0, 7.5, 0.0]
      attitude_quat_bn: [0.9961947, 0.0, 0.0871557, 0.0]
      angular_rate_body_rad_s: [0.0, 0.0, 0.0]
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.zero_controller"
      class_name: "ZeroController"
      params: {}
    attitude_control:
      kind: "python"
      module: "sim.control.attitude.cmg_steering"
      class_name: "CMGSteeringController"
      params:
        max_torque_nm: [0.02, 0.02, 0.02]
        momentum_nms: [1.0, 1.0, 1.0]
        gimbal_rate_limit_rad_s: [0.1, 0.1, 0.1]
        base_controller:
          module: "sim.control.attitude.baseline"
          class_name: "QuaternionPDController"
          params:
            desired_attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
            kp: 0.1
            kd: 0.02
            max_torque_nm: 0.05

simulator:
  scenario_type: "auto"
  duration_s: 5.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: "two_body"
      orbit_substep_s: 1.0
    attitude:
      enabled: true
      attitude_substep_s: 0.5
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false

outputs:
  output_dir: "outputs/controller_smokes/actuator_lab_presets"
  mode: "save"
  stats:
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
