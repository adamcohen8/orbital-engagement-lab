scenario_name: geosynchronous_30deg_90w_ground_track
scenario_description: Single-satellite inclined geosynchronous ground-track review
  case.
metadata:
  owner: public
  public_surface: public-config
  support_level: demonstration
  notes: 'Passive geosynchronous satellite initialized over 90 deg W longitude with
    30 deg inclination. Interactive output mode is enabled for review before saving
    artifacts.

    '
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: false
    role: chaser
    kind: satellite
  target:
    enabled: true
    role: target
    kind: satellite
    preset: basic_satellite
    specs:
      dry_mass_kg: 300.0
      fuel_mass_kg: 0.0
    initial_state:
      coes:
        a_km: 42164.169451
        ecc: 0.0
        inc_deg: 30.0
        raan_deg: 270.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
simulator:
  duration_s: 86160.0
  dt_s: 10.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 10.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/geosynchronous_30deg_90w_ground_track
  mode: interactive
  stats:
    enabled: true
    print_summary: true
    save_json: false
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: true
    types:
    - ground_track
    fps: 60
    speed_multiple: 100.0
    frame_stride: 2
    draw_earth_map: true
