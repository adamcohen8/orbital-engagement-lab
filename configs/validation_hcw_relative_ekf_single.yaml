scenario_name: validation_hcw_relative_ekf_single
metadata:
  owner: public
  public_surface: public-validation
  support_level: demonstration
  notes: Passive circular-chief RPO knowledge benchmark for HCW relative EKF wiring.
objects:
  chaser:
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      isp_s: 220.0
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      relative_to_target_ric:
        frame: rect
        state:
        - 0.1
        - -0.25
        - 0.05
        - 1.0e-05
        - -2.0e-05
        - 1.0e-05
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 2.0
      targets:
      - target
      conditions:
        require_line_of_sight: true
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.001
        - 0.001
        - 0.001
        vel_sigma_km_s:
        - 1.0e-05
        - 1.0e-05
        - 1.0e-05
      estimation:
        type: relative_hcw_ekf
        measurement_model: relative_state
        measurement_origin: deputy
        ekf:
          process_noise_diag:
          - 1.0e-12
          - 1.0e-12
          - 1.0e-12
          - 1.0e-14
          - 1.0e-14
          - 1.0e-14
          meas_noise_diag:
          - 1.0e-06
          - 1.0e-06
          - 1.0e-06
          - 1.0e-10
          - 1.0e-10
          - 1.0e-10
          init_cov_diag:
          - 0.0001
          - 0.0001
          - 0.0001
          - 1.0e-08
          - 1.0e-08
          - 1.0e-08
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        reference_object_id: target
        translation_mode: ric_hold
        goal_type: rpo.ric_hold
  target:
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    kind: satellite
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        translation_mode: stationkeeping
simulator:
  duration_s: 300.0
  dt_s: 2.0
  dynamics:
    orbit:
      orbit_substep_s: 2.0
      model: two_body
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: true
      attitude_substep_s: 0.2
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  resource_profile: laptop-safe
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/validation_hcw_relative_ekf_single
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  review:
    enabled: true
    detail: standard
  animations:
    enabled: false
    types: []
