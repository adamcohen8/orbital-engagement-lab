# Agent auto demo 01: TLE-initialized propagation plus ground-station access.
#
# Natural-language source:
# "I have a public ISS TLE and a Colorado Springs ground site. Can an OEL
# agent make a quick, public-core access screen for the next six hours, show
# whether any passes clear 10 degrees elevation, and give me the evidence it
# used?"
#
# Assumption boundary: this is not SGP4/general-perturbations propagation. OEL
# converts the TLE to an initial ECI state, then numerically integrates its
# configured force model.

scenario_name: "agent_auto_01_ground_access_demo"
scenario_description: "Agent-generated public demo: TLE-initialized propagation with geometric Colorado Springs access evidence."

metadata:
  owner: "public-oel-agents"
  notes: "Generated for the weekly OEL agentic workflow post. This is a geometric access screen, not an RF link or scheduling analysis."

objects:
  iss:
    kind: "satellite"
    enabled: true
    role: "tracked_satellite"
    specs:
      mass_kg: 420000.0
    initial_state:
      tle:
        line1: "1 25544U 98067A   24001.00000000  .00016717  00000+0  10270-3 0  9005"
        line2: "2 25544  51.6416  43.6012 0005423  52.3066  50.1234 15.50000000  1000"
        require_checksum: false
        propagate_to_initial_epoch: true
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.zero_controller"
      class_name: "ZeroController"
      params: {}

ground_stations:
  - id: "colorado_springs"
    lat_deg: 38.803
    lon_deg: -104.526
    alt_km: 1.9
    min_elevation_deg: 10.0
    max_range_km: 2500.0

simulator:
  scenario_type: "auto"
  duration_s: 21600.0
  dt_s: 60.0
  initial_jd_utc: 2460310.75
  dynamics:
    orbit:
      model: "two_body"
      orbit_substep_s: 60.0
      j2: true
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: "analytic_simple"
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137

outputs:
  output_dir: "outputs/agent_auto_01_ground_access_demo"
  mode: "save"
  stats:
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: true
    draw_earth_map: true
    figure_ids: ["ground_track", "ground_station_access"]
  animations:
    enabled: false
    types: []
