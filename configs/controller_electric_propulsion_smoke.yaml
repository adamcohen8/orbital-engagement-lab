scenario_name: controller_electric_propulsion_smoke
metadata:
  owner: public
  public_surface: public-actuator
  support_level: demonstration
scenario_description: V2 physical continuous-engine smoke using electric-propulsion limits and propellant flow.
objects:
  target:
    enabled: true
    specs:
      mass_kg: 500.0
      dry_mass_kg: 499.0
      fuel_mass_kg: 1.0
      actuators:
        enabled: true
        orbital:
          electric_propulsion:
            max_thrust_n: 0.5
            isp_s: 1600.0
            max_power_w: 100.0
            power_per_newton_w: 200.0
    initial_state:
      position_eci_km:
      - 7000.0
      - 0.0
      - 0.0
      velocity_eci_km_s:
      - 0.0
      - 7.5
      - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    role: target
    kind: satellite
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.continuous_engine.v1
      params:
        max_acceleration_m_s2: 0.001
        max_force_n: 0.5
        translation_mode: scheduled_burn
        scheduled_burns:
        - start_time_s: 0.0
          duration_s: 5.0
          delta_v_m_s: [0.001, 0.0, 0.0]
          frame: eci
simulator:
  duration_s: 5.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
    attitude:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/controller_smokes/electric_propulsion
  mode: save
  stats:
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
