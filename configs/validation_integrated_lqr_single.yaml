scenario_name: validation_integrated_lqr_single
metadata:
  owner: public
  public_surface: public-validation
  support_level: demonstration
  notes: Headless integrated safe-RPO benchmark with sensor-fed v2 HCW-LQR feedback to a nonzero hold point.
objects:
  chaser:
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -3.0
        - 0.0
        - 0.0
        - 0.0
        - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: true
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.005
        - 0.005
        - 0.005
        vel_sigma_km_s:
        - 5.0e-05
        - 5.0e-05
        - 5.0e-05
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        reference_object_id: target
        translation_mode: ric_hold
        control_law: hcw_lqr
        goal_type: rpo.ric_hold
        target_relative_state_ric_m: [0.0, -500.0, 0.0, 0.0, 0.0, 0.0]
  target:
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 5.0
      targets:
      - chaser
      conditions:
        require_line_of_sight: true
        max_range_km: 50000.0
      sensor_error:
        pos_sigma_km:
        - 0.02
        - 0.02
        - 0.02
        vel_sigma_km_s:
        - 0.0002
        - 0.0002
        - 0.0002
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
simulator:
  duration_s: 600.0
  dt_s: 5.0
  dynamics:
    orbit:
      orbit_substep_s: 5.0
      model: two_body
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: false
      attitude_substep_s: 0.1
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/validation_integrated_lqr_single
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
