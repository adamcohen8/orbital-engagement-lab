name: Documentation issue
description: Report unclear, missing, or incorrect public documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for documentation issues that do not involve sensitive
        information. For vulnerabilities or sensitive data exposure, use the
        private process in SECURITY.md.
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "docs/scenario-yaml.md, README.md, ..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional. Describe what would make the documentation clearer.
    validations:
      required: false
