name: CI

env:
  MPLBACKEND: Agg

on:
  pull_request:

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-core:
    runs-on: ubuntu-latest
    env:
      OEL_ACCELERATION: "off"
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.cache/numba
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/py311.txt

      - name: Restore compiled-kernel cache
        uses: actions/cache@v5
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'sim/acceleration/**/*.py', 'sim/dynamics/orbit/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/py311.txt ".[dev,game,accel,mcp]"
          python -m pip check

      - name: Run public PR acceptance tests
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          python -m pytest -q -m "fast or smoke or product" sim/tests
          --durations=50 --durations-min=0.25
          --junitxml=test-results-public-core.xml

      - name: Smoke Pygame with the dummy display driver
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -q sim/tests/test_platform_compat.py -k pygame_dummy_display

      - name: Upload public-test timing evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-timing-public-core
          path: test-results-public-core.xml

      - name: Check quickstart readiness
        run: python run_simulation.py --doctor

      - name: Validate five-minute quickstart scenario
        run: python run_simulation.py --quickstart --validate-only

      - name: Validate curated public example configs
        run: |
          python run_simulation.py --config configs/aero_assisted_plane_change_demo.yaml --validate-only
          python run_simulation.py --config examples/configs/public_tle_2hr_propagation.yaml --validate-only
          python run_simulation.py --config examples/configs/public_ground_station_access_from_tle.yaml --validate-only
          python run_simulation.py --config examples/configs/public_closed_loop_rendezvous_lqr.yaml --validate-only
          python run_simulation.py --config examples/configs/public_rendezvous_closed_loop.yaml --validate-only
          python run_simulation.py --config examples/configs/public_orbit_environment_stack.yaml --validate-only
          python run_simulation.py --config examples/configs/public_attitude_hold_disturbance.yaml --validate-only
          python run_simulation.py --config examples/configs/public_manual_rpo_training.yaml --validate-only
          python run_simulation.py --config examples/configs/public_manual_engagement.yaml --validate-only

      - name: Run five-minute quickstart scenario headlessly
        run: python run_simulation.py --quickstart

      - name: Check quickstart start-here artifacts
        run: |
          test -f outputs/quickstart_5min/index.md
          test -f outputs/quickstart_5min/master_run_summary.json
