name: Dependency audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "constraints/**"
      - "requirements/**"
      - "requirements*.txt"
      - "tools/generate_dependency_evidence.py"
      - "tools/generate_python_sbom.py"
      - "tools/run_supply_chain_gate.py"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "31 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  dependency-audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/py311.txt

      - name: Audit Python dependencies
        run: |
          python tools/run_supply_chain_gate.py \
            --output-dir outputs/supply_chain \
            --install-full \
            --constraints constraints/py311.txt

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supply-chain-evidence
          path: outputs/supply_chain/
          retention-days: 30
