name: Deploy RPO Trainer Preview

on:
  push:
    branches: [main]
    paths:
      - "web/rpo-trainer-preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke static preview
        run: |
          node --check web/rpo-trainer-preview/src/app.js
          python -m http.server 8765 --directory web/rpo-trainer-preview >/tmp/oel-pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/ -o /tmp/oel-preview-index.html
          curl -fsS http://127.0.0.1:8765/src/styles.css -o /tmp/oel-preview-styles.css
          curl -fsS http://127.0.0.1:8765/src/app.js -o /tmp/oel-preview-app.js
          curl -fsS http://127.0.0.1:8765/src/competition/arcade-engine.js -o /tmp/oel-preview-arcade-engine.js
          curl -fsS http://127.0.0.1:8765/assets/01_insert_coin_to_orbit.wav -o /tmp/oel-preview-selector-music.wav
          curl -fsS http://127.0.0.1:8765/assets/10_training_grid_sunrise.wav -o /tmp/oel-preview-tutorial-music.wav
          curl -fsS http://127.0.0.1:8765/assets/06_casting_the_orbit_line.wav -o /tmp/oel-preview-sandbox-music.wav
          curl -fsS http://127.0.0.1:8765/assets/21_pursuit_arcade_overdrive_no_siren_demo.wav -o /tmp/oel-preview-arcade-music.wav
          curl -fsS http://127.0.0.1:8765/assets/28_high_shred_boss_riff.wav -o /tmp/oel-preview-boss-music.wav
          grep -q "RPO Trainer Preview" /tmp/oel-preview-index.html
          grep -q "Pursuit Arcade" /tmp/oel-preview-index.html
          grep -q "createPursuitArcadeSession" /tmp/oel-preview-arcade-engine.js
          grep -q "M Music: ON" /tmp/oel-preview-index.html
          test -s /tmp/oel-preview-selector-music.wav
          test -s /tmp/oel-preview-tutorial-music.wav
          test -s /tmp/oel-preview-sandbox-music.wav
          test -s /tmp/oel-preview-arcade-music.wav
          test -s /tmp/oel-preview-boss-music.wav

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/rpo-trainer-preview

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
