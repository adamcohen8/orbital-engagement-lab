name: Cross-platform compatibility

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Compatibility coverage to run
        required: true
        default: canary
        type: choice
        options:
          - canary
          - full

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compatibility-plan:
    name: Select compatibility scope
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build compatibility matrix
        id: plan
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          scope="${REQUESTED_SCOPE:-canary}"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python tools/compatibility_matrix.py --scope "$scope")" >> "$GITHUB_OUTPUT"

  compatibility-smoke:
    name: Smoke / ${{ matrix.platform_name }} / Python ${{ matrix.python_version }}
    needs: compatibility-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-plan.outputs.matrix) }}
    env:
      CONSTRAINTS_FILE: constraints/${{ matrix.python_id }}.txt
      EVIDENCE_DIR: outputs/compatibility/${{ matrix.evidence_arch }}-${{ matrix.python_id }}
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.cache/numba
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.setup_arch }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ${{ env.CONSTRAINTS_FILE }}

      - name: Restore compiled-kernel cache
        uses: actions/cache@v5
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: >-
            numba-${{ runner.os }}-${{ matrix.evidence_arch }}-${{
            matrix.python_id }}-${{ hashFiles(format('constraints/{0}.txt',
            matrix.python_id)) }}-${{ hashFiles('sim/acceleration/**/*.py',
            'sim/dynamics/orbit/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-${{ matrix.evidence_arch }}-${{ matrix.python_id }}-

      - name: Install constrained cross-platform profile from wheels
        run: |
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; Path(r'${{ env.EVIDENCE_DIR }}').mkdir(parents=True, exist_ok=True)"
          python -m pip install --only-binary=:all: -c "${{ env.CONSTRAINTS_FILE }}" ".[cross-platform]" --report "${{ env.EVIDENCE_DIR }}/pip-install-report.json"
          python -m pip install "pip-audit>=2.9,<3"

      - name: Audit installed dependencies
        run: >-
          python -m pip_audit --format json
          --output "${{ env.EVIDENCE_DIR }}/pip-audit.json"

      - name: Run compatibility smoke and collect evidence
        run: >-
          python tools/run_compatibility_smoke.py
          --constraints "${{ env.CONSTRAINTS_FILE }}"
          --install-report "${{ env.EVIDENCE_DIR }}/pip-install-report.json"
          --audit-result "${{ env.EVIDENCE_DIR }}/pip-audit.json"
          --output-dir "${{ env.EVIDENCE_DIR }}"
          --acceptance-class github-hosted-automation
          --expected-system "${{ matrix.system }}"
          --expected-machine "${{ matrix.machine }}"
          --expected-acceleration "${{ matrix.acceleration }}"

      - name: Run authoritative compatibility acceptance
        run: >-
          python validation/compatibility_acceptance.py
          --output-dir "${{ env.EVIDENCE_DIR }}/authoritative-acceptance"

      - name: Verify compatibility packet
        run: >-
          python -c "import json; from pathlib import Path;
          smoke=Path(r'${{ env.EVIDENCE_DIR }}/compatibility-evidence.json');
          authoritative=Path(r'${{ env.EVIDENCE_DIR }}/authoritative-acceptance/compatibility_acceptance_manifest.json');
          assert smoke.is_file(); assert authoritative.is_file();
          assert json.loads(authoritative.read_text(encoding='utf-8'))['overall_passed'] is True"

      - name: Run full public regression on boundary interpreters
        if: matrix.boundary
        env:
          OEL_ACCELERATION: "off"
        run: >-
          python -m pytest -q sim/tests
          --durations=50 --durations-min=0.25
          --junitxml="${{ env.EVIDENCE_DIR }}/boundary-regression.xml"

      - name: Exercise acceleration and validation boundaries
        if: matrix.boundary
        env:
          OEL_ACCELERATION: auto
        run: >-
          python -m pytest -q
          sim/tests/test_acceleration.py
          sim/tests/test_tle_initialization.py
          sim/tests/test_sgp4_dependency_parity.py
          --junitxml="${{ env.EVIDENCE_DIR }}/boundary-capabilities.xml"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-${{ matrix.evidence_arch }}-${{ runner.os }}-${{ matrix.python_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
