scenario_name: public_agent_ogp_sgp4_propagation
scenario_description: 'Public agent golden workflow: deterministic two-hour passive
  OGP-SGP4 propagation from a fixed historical public TLE with standard review evidence.'
metadata:
  owner: public-oel-agents
  public_surface: public-agent-example
  support_level: supported
  notes: This fixed historical TLE is an offline regression fixture. It is not a current
    catalog product or an operational ephemeris.
objects:
  catalog_object:
    kind: satellite
    enabled: true
    role: target
    propagation_method: general
    general:
      model: sgp4
      output_frame: teme
    specs:
      mass_kg: 420000.0
    initial_state:
      tle:
        line1: 1 25544U 98067A   24001.00000000  .00016717  00000+0  10270-3 0  9003
        line2: 2 25544  51.6416  43.6012 0005423  52.3066  50.1234 15.50000000  1004
        require_checksum: true
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
simulator:
  duration_s: 7200.0
  dt_s: 120.0
  initial_jd_utc: 2460310.5
  dynamics:
    orbit:
      propagation_method: special
      model: two_body
    attitude:
      enabled: false
    rocket:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/agents/public_agent_ogp_sgp4_propagation
  mode: save
  stats:
    enabled: true
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
