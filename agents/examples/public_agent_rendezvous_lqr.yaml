# Agent example: closed-loop rendezvous with public HCW LQR control.
#
# Natural-language source:
# "Create a short, headless two-satellite rendezvous scenario. Put a chaser
# 5 km behind a passive target with a small cross-track offset, use the public
# HCW LQR controller, validate before running, and save queryable review
# outputs."

scenario_name: public_agent_rendezvous_lqr
scenario_description: "Agent-generated public rendezvous smoke scenario using HCW LQR."

metadata:
  owner: public-oel-agents
  notes: "Headless agent example for config creation, validation, execution, review-store querying, and output inspection."

objects:
  target:
    kind: satellite
    enabled: true
    role: target
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 360.0
      fuel_mass_kg: 0.0
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}
  chaser:
    kind: satellite
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 20.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
    initial_state:
      relative_to: target
      relative_to_target_ric:
        frame: curv
        state: [0.0, -5.0, 0.2, 0.0, 0.0002, 0.0]
    orbit_control:
      kind: python
      module: sim.control.orbit.lqr
      class_name: HCWLQRController
      params:
        mean_motion_rad_s: 0.001078
        max_accel_km_s2: 2.0e-5
        design_dt_s: 5.0
        ric_curv_state_slice: [0, 6]
        chief_eci_state_slice: [6, 12]
    knowledge:
      refresh_rate_s: 5.0
      targets: [target]
      conditions:
        require_line_of_sight: true
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km: [0.005, 0.005, 0.005]
        vel_sigma_km_s: [0.00005, 0.00005, 0.00005]
      estimation:
        type: ekf

simulator:
  scenario_type: auto
  duration_s: 1000.0
  dt_s: 5.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 5.0
      j2: false
      drag: false
      srp: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false

outputs:
  output_dir: outputs/agents/public_agent_rendezvous_lqr
  mode: save
  stats:
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []

monte_carlo:
  enabled: false
