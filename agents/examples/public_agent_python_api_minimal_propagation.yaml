scenario_name: public_agent_python_api_minimal_propagation
scenario_description: Expected artifact shape for the Python API minimal propagation
  task card, using a five-minute deterministic propagation horizon.
objects:
  target:
    kind: satellite
    role: target
    propagation_method: ''
    specs:
      mass_kg: 300.0
    initial_state:
      position_eci_km:
      - 7000.0
      - 0.0
      - 0.0
      velocity_eci_km_s:
      - 0.0
      - 7.5
      - 0.0
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
simulator:
  duration_s: 300.0
  dt_s: 10.0
  execution:
    policy: configured
    object_parallelism:
      enabled: false
      backend: serial
      workers: 0
      max_workers: 0
      reserve_workers: 1
      min_objects: 3
    runtime_profiler:
      enabled: true
    controller:
      orbit_budget_ms: 2.0
      attitude_budget_ms: 2.0
      deadline_policy: record
  frames:
    model: simple_gmst
    eop_extrapolation: error
    time_scale_model: utc_only
    ddpsi_rad: 0.0
    ddeps_rad: 0.0
  dynamics:
    attitude:
      enabled: false
outputs:
  output_dir: outputs/agents/public_agent_python_api_minimal_propagation
  mode: save
  stats:
    print_summary: false
    save_full_log: false
    controller_debug: false
  plots:
    enabled: false
  animations:
    enabled: false
  review:
    enabled: true
    detail: standard
