scenario_name: public_agent_mission_reconstitution_trade_space
scenario_description: 'Public agent example: apply a simple +I in-track burn, then
  generate a simulator-backed mission reconstitution trade space with min-time, min-delta-v,
  and constrained recovery recommendations after a ten-minute propagation.

  '
objects:
  target:
    enabled: true
    role: target
    kind: satellite
    specs:
      mass_kg: 100.0
      isp_s: 220.0
    initial_state:
      coes:
        a_km: 6778.137
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        translation_mode: stationkeeping
simulator:
  duration_s: 600.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: false
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/agents/public_agent_mission_reconstitution_trade_space
  mode: save
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
  review:
    enabled: true
    detail: standard
analysis:
  mission_recovery:
    enabled: true
    object_id: target
    goal: orbit_slot
    assessment_time_s: final
    slot_tolerance_deg: 1.0
    max_phasing_orbits: 25
    planner:
      enabled: true
      modes:
      - min_delta_v
      - min_time
      - constrained
      max_recovery_time_s: 86400.0
      max_recovery_delta_v_m_s: 15.0
      candidate_count: 8
      simulate_candidates: true
    propulsion:
      spacecraft_mass_kg: 100.0
      isp_s: 220.0
      max_thrust_n: 20.0
    element_tolerances:
      a_km: 1.0
      ecc: 0.001
