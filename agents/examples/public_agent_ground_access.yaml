# Agent example: TLE propagation plus passive ground-station access.
#
# Natural-language source:
# "Create a short public scenario that propagates a TLE and checks whether a
# Colorado Springs ground station can see it. Keep the run headless and save
# JSON summary outputs."

scenario_name: public_agent_ground_access
scenario_description: "Agent-generated public TLE and ground-station access smoke scenario."

metadata:
  owner: public-oel-agents
  notes: "Headless agent example for access-window scenario generation."

objects:
  iss:
    kind: satellite
    enabled: true
    role: tracked_satellite
    specs:
      mass_kg: 420000.0
    initial_state:
      tle:
        line1: "1 25544U 98067A   24001.00000000  .00016717  00000+0  10270-3 0  9005"
        line2: "2 25544  51.6416  43.6012 0005423  52.3066  50.1234 15.50000000  1000"
        require_checksum: false
        propagate_to_initial_epoch: true
    orbit_control:
      kind: python
      module: sim.control.orbit.zero_controller
      class_name: ZeroController
      params: {}

ground_stations:
  - id: colorado_springs
    lat_deg: 38.803
    lon_deg: -104.526
    alt_km: 1.9
    min_elevation_deg: 10.0
    max_range_km: 2500.0

simulator:
  scenario_type: auto
  duration_s: 3600.0
  dt_s: 120.0
  initial_jd_utc: 2460310.75
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 120.0
      j2: true
      j3: false
      j4: false
      drag: false
      srp: false
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137

outputs:
  output_dir: outputs/agents/public_agent_ground_access
  mode: save
  stats:
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []

monte_carlo:
  enabled: false

