scenario_name: public_agent_attitude_hold
scenario_description: Agent-generated public five-minute attitude-hold settling scenario
  with review-store evidence.
metadata:
  owner: public-oel-agents
  notes: Headless agent example for attitude-control scenario generation.
objects:
  bus:
    kind: satellite
    enabled: true
    role: attitude_test_article
    specs:
      mass_kg: 120.0
      mass_properties:
        inertia_kg_m2:
        - - 12.0
          - 0.0
          - 0.0
        - - 0.0
          - 10.0
          - 0.0
        - - 0.0
          - 0.0
          - 8.0
        inertia_reference_point: center_of_mass
        frame: body
    initial_state:
      position_eci_km:
      - 7000.0
      - 0.0
      - 0.0
      velocity_eci_km_s:
      - 0.0
      - 7.5
      - 0.0
      attitude_quat_bn:
      - 0.9063078
      - 0.0
      - 0.4226183
      - 0.0
      angular_rate_body_rad_s:
      - 0.02
      - -0.015
      - 0.01
    flight_software:
      stack: fsw.attitude_reference
      hardware_profile: hardware.ideal_wrench.v1
      params: {}
simulator:
  duration_s: 300.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
    attitude:
      enabled: true
      attitude_substep_s: 0.1
      disturbance_torques:
        gravity_gradient: true
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/agents/public_agent_attitude_hold
  mode: save
  stats:
    print_summary: false
    save_json: true
    save_csv: false
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
