[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-engagement-lab"
version = "0.6.2"
description = "Integrated spacecraft simulation and analysis platform for rendezvous, control, validation, and mission prototyping."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Orbital Engagement Lab Contributors" },
]
dependencies = [
  "numpy<2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
gui = [
  "PySide6>=6.7",
]
game = [
  "pygame>=2.5",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4",
]
ml = [
  "gymnasium>=0.29",
  "torch>=2.1",
  "lightning>=2.2",
]
full = [
  "pytest>=8.0",
  "ruff>=0.6",
  "PySide6>=6.7",
  "pygame>=2.5",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4",
  "gymnasium>=0.29",
  "torch>=2.1",
  "lightning>=2.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
sim = ["presets/objects/*.yaml", "game/configs/*.yaml"]

[tool.setuptools.packages.find]
include = ["sim*", "machine_learning*"]
exclude = ["sim.tests", "sim.tests.*"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [
  "build",
  "dist",
  "examples/experiments",
  "outputs",
  "examples/outputs",
  "validation/High Precision Orbit Propagator_4-2",
  "validation/data",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"integrations/cfs_sil/mock_cfs_endpoint.py" = ["E402"]
"machine_learning/gym_env.py" = ["E402"]
"validation/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
markers = [
  "smoke: fast first-line checks for core import, API, quickstart, and release workflow health",
  "product: tests protecting documented product workflows, public contracts, and release-facing behavior",
  "regression: ordinary regression coverage for supported behavior",
  "validation: tests or tooling checks tied to validation evidence, fidelity, or release governance",
  "slow: tests that are comparatively expensive and better suited to scheduled or full-suite runs",
  "external: tests covering optional integrations, external-tool bridges, or dependency-boundary behavior",
]
