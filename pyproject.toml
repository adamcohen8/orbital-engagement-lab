[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-engagement-lab"
version = "0.10.0"
description = "Integrated spacecraft simulation and analysis platform for rendezvous, control, validation, and mission prototyping."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Orbital Engagement Lab Contributors" },
]
dependencies = [
  "numpy<2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.6",
]
gui = [
  "PySide6>=6.7",
]
game = [
  "pygame>=2.5",
  "Pillow>=12.2.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4",
]
ml = [
  "gymnasium>=0.29",
  "torch>=2.9.0",
  "filelock>=3.20.3",
]
accel = [
  "numba>=0.59",
  "scipy>=1.13",
]
full = [
  "pytest>=9.0.3",
  "ruff>=0.6",
  "PySide6>=6.7",
  "pygame>=2.5",
  "Pillow>=12.2.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4",
  "gymnasium>=0.29",
  "torch>=2.9.0",
  "filelock>=3.20.3",
  "numba>=0.59",
  "scipy>=1.13",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
sim = [
  "presets/objects/*.yaml",
  "game/configs/*.yaml",
  "game/assets/*.png",
  "game/music/*.md",
  "game/music/01_insert_coin_to_orbit.wav",
  "game/music/02_rendezvous_vector.wav",
  "game/music/04_docking_bay_neon.wav",
  "game/music/05_final_burn_victory_loop.wav",
  "game/music/06_casting_the_orbit_line.wav",
  "game/music/07_starfield_attract_mode.wav",
  "game/music/08_silent_running_radar.wav",
  "game/music/09_defender_boss_vector.wav",
  "game/music/10_training_grid_sunrise.wav",
  "game/music/15_mission_failed_lament_credits.wav",
  "game/music/17_orbital_boss_metal.wav",
  "game/music/18_keepout_zone_accelerando.wav",
  "game/music/19_cross_track_ghost_orbit.wav",
  "game/music/21_pursuit_arcade_overdrive_no_siren_demo.wav",
  "game/music/22_arcade_round_clear_flyover.wav",
  "game/music/23_elliptic_final_burn_cinematic.wav",
  "game/music/28_high_shred_boss_riff.wav",
]

[tool.setuptools.packages.find]
include = ["sim*", "machine_learning*"]
exclude = ["sim.tests", "sim.tests.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "build",
  "dist",
  "examples/experiments",
  "outputs",
  "examples/outputs",
  "validation/High Precision Orbit Propagator_4-2",
  "validation/data",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  "E501",
  "B905",
  "UP007",
  "UP035",
  "UP041",
]

[tool.ruff.lint.per-file-ignores]
"machine_learning/gym_env.py" = ["E402"]
"validation/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
markers = [
  "smoke: fast first-line checks for core import, API, quickstart, and release workflow health",
  "product: tests protecting documented product workflows, public contracts, and release-facing behavior",
  "regression: ordinary regression coverage for supported behavior",
  "validation: tests or tooling checks tied to validation evidence, fidelity, or release governance",
  "slow: tests that are comparatively expensive and better suited to scheduled or full-suite runs",
  "external: tests covering optional integrations, external-tool bridges, or dependency-boundary behavior",
]
