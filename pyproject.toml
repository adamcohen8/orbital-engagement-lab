[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-engagement-lab"
version = "0.22.0"
description = "Integrated spacecraft simulation and analysis platform for rendezvous, control, validation, and mission prototyping."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Orbital Engagement Lab Contributors" },
]
dependencies = [
  "numpy<2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "PyYAML>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff==0.15.14",
]
game = [
  "pygame>=2.5",
  "Pillow>=12.3.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4",
]
ml = [
  "gymnasium>=0.29",
  "torch>=2.9.0",
  "filelock>=3.20.3",
]
accel = [
  "numba>=0.59",
]
validation = [
  "sgp4==2.23",
]
full = [
  "pytest>=9.0.3",
  "ruff==0.15.14",
  "pygame>=2.5",
  "Pillow>=12.3.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4",
  "gymnasium>=0.29",
  "torch>=2.9.0",
  "filelock>=3.20.3",
  "numba>=0.59",
  "scipy>=1.13",
  "sgp4==2.23",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
sim = [
  "presets/objects/*.yaml",
  "dynamics/orbit/data/*.csv",
  "dynamics/orbit/data/*.dat",
  "game/configs/*.yaml",
  "game/assets/*.png",
  "game/assets/*.md",
  "game/music/*.md",
]

[tool.setuptools.exclude-package-data]
sim = [
  "game/music/*.wav",
]

[tool.setuptools.packages.find]
include = ["sim*", "machine_learning*"]
exclude = ["sim.tests", "sim.tests.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "build",
  "dist",
  "examples/experiments",
  "outputs",
  "examples/outputs",
  "validation/High Precision Orbit Propagator_4-2",
  "validation/data",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  "E501",
  "B905",
  "UP007",
  "UP035",
  "UP041",
]

[tool.ruff.lint.per-file-ignores]
"machine_learning/gym_env.py" = ["E402"]
"sim/dynamics/orbit/_sdp4_equations.py" = ["E101", "E702", "E703", "I001", "UP030", "UP032"]
"validation/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
markers = [
  "smoke: fast first-line checks for core import, API, quickstart, and release workflow health",
  "product: tests protecting documented product workflows, public contracts, and release-facing behavior",
  "regression: ordinary regression coverage for supported behavior",
  "fast: measured sub-second and ordinary deterministic checks for rapid local feedback",
  "compiled: tests that intentionally exercise accelerated backend selection, parity, or fallback behavior",
  "validation: tests or tooling checks tied to validation evidence, fidelity, or release governance",
  "slow: tests that are comparatively expensive and better suited to scheduled or full-suite runs",
  "external: tests covering optional integrations, external-tool bridges, or dependency-boundary behavior",
]
