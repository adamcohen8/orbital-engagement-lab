scenario_name: public_tle_2hr_propagation
scenario_description: 'Public example: initialize one satellite from a TLE, propagate
  for two hours with OEL numerical perturbations, and save the predicted state history.'
metadata:
  owner: public
  public_surface: public-example
  support_level: supported
  notes: Run with `.venv/bin/python run_simulation.py --config examples/configs/public_tle_2hr_propagation.yaml`.
    This is not continuous OGP catalog propagation; OEL uses OGP to recover the TLE
    initial state and then numerically integrates its configured ONP force model.
objects:
  iss:
    kind: satellite
    enabled: true
    role: tracked_satellite
    specs:
      mass_kg: 420000.0
      aero:
        reference_area_m2: 900.0
        cd: 2.2
      cr: 1.2
    initial_state:
      tle:
        line1: 1 25544U 98067A   24001.00000000  .00016717  00000+0  10270-3 0  9003
        line2: 2 25544  51.6416  43.6012 0005423  52.3066  50.1234 15.50000000  1004
        require_checksum: true
        propagate_to_initial_epoch: true
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
simulator:
  duration_s: 7200.0
  dt_s: 60.0
  initial_jd_utc: 2460310.75
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 60.0
      j2: true
      j3: true
      j4: true
      drag: true
      srp: true
      third_body_sun: true
      third_body_moon: true
    attitude:
      enabled: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_model: harris_priester
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: true
    earth_radius_km: 6378.137
outputs:
  output_dir: outputs/examples/public_tle_2hr_propagation
  mode: save
  stats:
    print_summary: true
    save_json: true
    save_full_log: true
  plots:
    enabled: true
    figure_ids:
    - orbit_eci
    - ground_track
  animations:
    enabled: false
    types: []
