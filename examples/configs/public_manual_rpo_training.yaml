# Use case: "Practice manual RPO control with a dashboard-style scenario."
#
# Key parameters to vary:
# - metadata.game.player_max_accel_km_s2: player thrust authority.
# - objects.chaser.initial_state.relative_to_target_ric.state: starting offset.
# - objects.target.mission_strategy.params: defensive target behavior.
# - outputs.animations/types: save dashboard animations for review.

scenario_name: "public_manual_rpo_training"
scenario_description: "Public example: manual chaser control against a passive/defensive target."

metadata:
  owner: "public"
  notes: "Run interactively with `.venv/bin/python run_game.py examples/configs/public_manual_rpo_training.yaml`."
  game:
    # Use direct RIC translation controls for the public game-style trainer.
    control_mode: "ric_translation"
    # Key knob: player control authority.
    player_max_accel_km_s2: 1.8e-4

objects:
  target:
    kind: "satellite"
    enabled: true
    role: "target"
    reference_orbit:
      enabled: true
    specs:
      preset_satellite: "BASIC_SATELLITE"
      dry_mass_kg: 1800.0
      fuel_mass_kg: 5.0
      thruster: "BASIC_CHEMICAL_Z_BOTTOM"
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.zero_controller"
      class_name: "ZeroController"
      params: {}
    mission_strategy:
      kind: "python"
      module: "sim.mission.modules"
      class_name: "DefensiveMissionStrategy"
      params:
        chaser_id: "chaser"
        # Key knobs: set defense_mode to passive/fixed_ric_axis and adjust burn_accel.
        defense_mode: "fixed_ric_axis"
        axis_mode: "-C"
        burn_accel_km_s2: 2.0e-6
  chaser:
    kind: "satellite"
    enabled: true
    role: "chaser"
    specs:
      preset_satellite: "BASIC_SATELLITE"
      dry_mass_kg: 180.0
      fuel_mass_kg: 5.0
      thruster: "BASIC_CHEMICAL_Z_BOTTOM"
    initial_state:
      relative_to: "target"
      relative_to_target_ric:
        frame: "curv"
        # Key knob: player starting geometry in target-centered RIC.
        state: [0.0, -5.0, 0.0, 0.0, 0.0, 0.002]
    orbit_control:
      kind: "python"
      module: "sim.control.orbit.zero_controller"
      class_name: "ZeroController"
      params: {}
    knowledge:
      refresh_rate_s: 1.0
      targets: ["target"]
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km: [0.0, 0.0, 0.0]
        vel_sigma_km_s: [0.0, 0.0, 0.0]
      estimation:
        type: "ekf"

simulator:
  duration_s: 300.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: "two_body"
      orbit_substep_s: 1.0
    attitude:
      enabled: false
    rocket:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false

outputs:
  output_dir: "outputs/examples/public_manual_rpo_training"
  mode: "save"
  stats:
    print_summary: true
    save_json: true
    save_full_log: true
  plots:
    enabled: true
    figure_ids: ["rendezvous_summary", "relative_range", "trajectory_ric_curv_2d_multi"]
  animations:
    enabled: false
    types: []

monte_carlo:
  enabled: false
