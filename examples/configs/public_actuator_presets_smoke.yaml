scenario_name: public_actuator_presets_smoke
scenario_description: Public actuator preset smoke example covering RCS, electric
  propulsion, and CMG attitude steering vocabulary.
metadata:
  owner: public
  public_surface: public-actuator
  support_level: supported
  seed: 123
  notes: Trimmed actuator vocabulary example for reading and validating object specs.
objects:
  rcs_sat:
    enabled: true
    kind: satellite
    specs:
      mass_kg: 250.0
      actuator_preset: BASIC_RCS_6DOF
    initial_state:
      position_eci_km:
      - 7000.0
      - 0.0
      - 0.0
      velocity_eci_km_s:
      - 0.0
      - 7.5
      - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.orbit_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 1.0
        translation_mode: stationkeeping
  ep_sat:
    enabled: true
    kind: satellite
    specs:
      mass_kg: 250.0
      actuators:
        preset: BASIC_ELECTRIC_PROPULSION
        orbital:
          electric_propulsion:
            max_thrust_n: 0.25
    initial_state:
      position_eci_km:
      - 7000.0
      - 2.0
      - 0.0
      velocity_eci_km_s:
      - 0.0
      - 7.5
      - 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.low_thrust_reference
      hardware_profile: hardware.continuous_engine.v1
      params:
        max_acceleration_m_s2: 1.0
        translation_mode: low_thrust_phasing
  cmg_sat:
    enabled: true
    kind: satellite
    specs:
      mass_kg: 120.0
      mass_properties:
        inertia_reference_point: center_of_mass
        inertia_kg_m2:
        - - 12.0
          - 0.0
          - 0.0
        - - 0.0
          - 10.0
          - 0.0
        - - 0.0
          - 0.0
          - 8.0
      actuators:
        preset: BASIC_CMG_TRIAD
        attitude:
          control_moment_gyros:
            max_torque_nm:
            - 0.02
            - 0.02
            - 0.02
    initial_state:
      position_eci_km:
      - 7000.0
      - 4.0
      - 0.0
      velocity_eci_km_s:
      - 0.0
      - 7.5
      - 0.0
      attitude_quat_bn:
      - 0.9961947
      - 0.0
      - 0.0871557
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    flight_software:
      stack: fsw.attitude_reference
      hardware_profile: hardware.ideal_wrench.v1
      params: {}
simulator:
  duration_s: 5.0
  dt_s: 1.0
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 1.0
    attitude:
      enabled: true
      attitude_substep_s: 0.5
      disturbance_torques:
        gravity_gradient: false
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/examples/public_actuator_presets_smoke
  mode: save
  stats:
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
