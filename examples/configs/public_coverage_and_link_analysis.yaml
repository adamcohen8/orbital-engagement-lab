scenario_name: public_coverage_and_link_analysis
scenario_description: >-
  Public experimental example: propagate two passive spacecraft once, then
  evaluate whole-Earth conical coverage and a directed free-space link budget
  from the retained deterministic histories.
metadata:
  owner: public
  public_surface: public-example
  support_level: experimental
  notes: >-
    Validate before running. Coverage and link analysis are evidence-only
    post-processing and do not influence the simulation loop.

objects:
  satellite_a:
    kind: satellite
    enabled: true
    role: coverage_source_and_transmitter
    specs:
      mass_kg: 250.0
    initial_state:
      position_eci_km: [0.0, 0.0, 6878.137]
      velocity_eci_km_s: [7.612, 0.0, 0.0]
      attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      angular_rate_body_rad_s: [0.0, 0.0, 0.0]
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}
  satellite_b:
    kind: satellite
    enabled: true
    role: link_receiver
    specs:
      mass_kg: 250.0
    initial_state:
      position_eci_km: [0.0, 0.0, 6888.137]
      velocity_eci_km_s: [7.606, 0.0, 0.0]
      attitude_quat_bn: [1.0, 0.0, 0.0, 0.0]
      angular_rate_body_rad_s: [0.0, 0.0, 0.0]
    flight_software:
      stack: fsw.passive
      hardware_profile: hardware.passive.v1
      params: {}

simulator:
  duration_s: 120.0
  dt_s: 10.0
  initial_jd_utc: 2461041.5
  dynamics:
    orbit:
      model: two_body
    attitude:
      enabled: true
    rocket:
      enabled: false
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false

outputs:
  output_dir: outputs/examples/public_coverage_and_link_analysis
  mode: save
  stats:
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
  orbital_analysis:
    enabled: true
    coverage:
      - analysis_id: satellite_a_global
        source_object_id: satellite_a
        sensor_id: satellite_a.imager
        order: 5
        half_angle_deg: 20.0
        quat_body_from_sensor: [0.0, 1.0, 0.0, 0.0]
        transition_time_tolerance_s: 0.25
        transition_max_iterations: 30
        include_cell_csv: false
    directed_links:
      - analysis_id: satellite_a_to_b
        link_id: satellite_a_to_b
        tx_object_id: satellite_a
        rx_object_id: satellite_b
        tx_terminal:
          terminal_id: satellite_a.tx
          pattern:
            kind: constant
            gain_dbi: 20.0
        rx_terminal:
          terminal_id: satellite_b.rx
          pattern:
            kind: constant
            gain_dbi: 20.0
        carrier_frequency_hz: 2200000000.0
        tx_power_w: 10.0
        data_rate_bps: 1000000.0
        system_noise_temperature_k: 300.0
        required_eb_n0_db: 5.0
        transition_time_tolerance_s: 0.25
        transition_max_iterations: 30
        include_margin_plot: false
