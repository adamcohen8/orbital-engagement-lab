scenario_name: public_sgp4_passive_eci_transform
scenario_description: Passive public TLE propagation from SGP4 TEME states transformed
  to ECI with the opt-in Vallado IAU-80 reduction.
objects:
  iss:
    kind: satellite
    enabled: true
    role: target
    propagation_method: general
    general:
      model: sgp4
      output_frame: eci
      frame_transform: teme_to_eci_iau80
    specs:
      mass_kg: 420000.0
    initial_state:
      tle:
        line1: 1 25544U 98067A   24001.00000000  .00016717  00000+0  10270-3 0  9005
        line2: 2 25544  51.6416  43.6012 0005423  52.3066  50.1234 15.50000000  1000
simulator:
  duration_s: 7200.0
  dt_s: 120.0
  initial_jd_utc: 2460310.5
  dynamics:
    orbit:
      propagation_method: special
      model: two_body
    attitude:
      enabled: false
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/examples/public_sgp4_passive_eci_transform
  mode: save
  stats:
    print_summary: true
    save_json: true
    save_full_log: false
  review:
    enabled: true
    detail: standard
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
