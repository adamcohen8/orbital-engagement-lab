scenario_name: public_manual_engagement
scenario_description: 'Public example: manual/game-mode chaser control with attitude
  stabilization, knowledge, target defensive logic, and dashboard-ready outputs.'
metadata:
  owner: public
  public_surface: public-example
  support_level: supported
  export_review:
    classification: public-educational-synthetic
    provenance: synthetic-no-customer-data
    approved_for_public_export: true
  notes: Run interactively with `.venv/bin/python run_game.py examples/configs/public_manual_engagement.yaml`.
  game:
    player_max_accel_km_s2: 0.00018
objects:
  rocket:
    enabled: false
    role: rocket
    kind: rocket
  chaser:
    enabled: true
    role: chaser
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 180.0
      fuel_mass_kg: 5.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      relative_to_target_ric:
        frame: curv
        state:
        - 0.0
        - -5.0
        - 0.0
        - 0.0
        - 0.0
        - 0.002
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
      relative_to: target
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - target
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.attitude_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_torque_n_m: 5.0
  target:
    enabled: true
    role: target
    reference_orbit:
      enabled: true
    specs:
      preset_satellite: BASIC_SATELLITE
      dry_mass_kg: 1800.0
      fuel_mass_kg: 5.0
      thruster: BASIC_CHEMICAL_Z_BOTTOM
      attitude_system: BASIC_REACTION_WHEELS_3AXIS
    initial_state:
      coes:
        a_km: 7000.0
        ecc: 0.0
        inc_deg: 45.0
        raan_deg: 0.0
        argp_deg: 0.0
        true_anomaly_deg: 0.0
      attitude_quat_bn:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      angular_rate_body_rad_s:
      - 0.0
      - 0.0
      - 0.0
    knowledge:
      refresh_rate_s: 1.0
      targets:
      - chaser
      conditions:
        require_line_of_sight: false
        max_range_km: 10000.0
      sensor_error:
        pos_sigma_km:
        - 0.0
        - 0.0
        - 0.0
        vel_sigma_km_s:
        - 0.0
        - 0.0
        - 0.0
      estimation:
        type: ekf
    kind: satellite
    flight_software:
      stack: fsw.rpo_reference
      hardware_profile: hardware.ideal_wrench.v1
      params:
        max_acceleration_m_s2: 0.02
        reference_object_id: chaser
        translation_mode: passive_retreat
        goal_type: rpo.passive_retreat
simulator:
  duration_s: 600.0
  dt_s: 0.5
  dynamics:
    orbit:
      model: two_body
      orbit_substep_s: 0.5
      j2: false
      j3: false
      j4: false
      drag: false
      srp: false
      third_body_sun: false
      third_body_moon: false
    attitude:
      enabled: true
      attitude_substep_s: 0.05
      disturbance_torques:
        gravity_gradient: true
        magnetic: false
        drag: false
        srp: false
    rocket:
      enabled: false
  environment:
    ephemeris_mode: analytic_simple
    atmosphere_env: {}
  plugin_validation:
    strict: true
  termination:
    earth_impact_enabled: false
outputs:
  output_dir: outputs/examples/public_manual_engagement
  mode: save
  stats:
    enabled: true
    print_summary: true
    save_json: true
    save_csv: false
    save_full_log: false
  plots:
    enabled: false
    figure_ids: []
  animations:
    enabled: false
    types: []
    battlespace_dashboard_target_object_id: target
    battlespace_dashboard_chaser_object_id: chaser
    battlespace_dashboard_show_trajectory: true
    battlespace_dashboard_attitude_dims_m:
      target:
      - 2.0
      - 1.5
      - 1.5
      chaser:
      - 2.0
      - 1.5
      - 1.5
    battlespace_dashboard_thruster_active_threshold_km_s2: 1.0e-15
    fps: 30
    speed_multiple: 1.0
    frame_stride: 1
